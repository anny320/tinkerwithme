name: Curriculum Generator Agent

on:
  repository_dispatch:
    types: [generate-curriculum]
  workflow_dispatch:
    inputs:
      track:
        description: 'Select track (arduino or ai)'
        required: true
        type: choice
        options:
          - arduino
          - ai
      projects:
        description: 'Project IDs (comma-separated, e.g., ar1,ar5)'
        required: true
      age_group:
        description: 'Age group'
        required: true
        type: choice
        options:
          - '6-9 yrs'
          - '10-12 yrs'
          - '13-15 yrs'
          - '7-10 yrs'
          - '10-13 yrs'
          - '13-16 yrs'
      duration:
        description: 'Session duration (minutes or full)'
        required: true
        type: choice
        options:
          - '90'
          - '120'
          - '180'
          - 'full'
      audience:
        description: 'Target audience'
        required: true
        type: choice
        options:
          - classroom
          - homeschool
      user_email:
        description: 'User email for delivery'
        required: true
      request_id:
        description: 'Unique request ID (auto-set by the web form)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate-curriculum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf2.0-0 \
            libffi-dev \
            shared-mime-info \
            fonts-liberation

      - name: Install Python dependencies
        run: pip install anthropic requests python-dotenv weasyprint

      - name: Generate Curriculum
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRACK: ${{ inputs.track || github.event.client_payload.track }}
          PROJECTS: ${{ inputs.projects || github.event.client_payload.projects }}
          AGE_GROUP: ${{ inputs.age_group || github.event.client_payload.age_group }}
          DURATION: ${{ inputs.duration || github.event.client_payload.duration }}
          AUDIENCE: ${{ inputs.audience || github.event.client_payload.audience || 'classroom' }}
          USER_EMAIL: ${{ inputs.user_email || github.event.client_payload.user_email }}
        run: python generate_curriculum.py

      - name: Publish PDF for download
        if: success()
        env:
          REQUEST_ID: ${{ inputs.request_id || github.event.client_payload.request_id || github.run_id }}
        run: |
          PDF=$(find output -name "*.pdf" | head -1)
          if [ -z "$PDF" ]; then
            echo "No PDF found in output/, skipping publish"
            exit 0
          fi
          mkdir -p downloads
          cp "$PDF" "downloads/${REQUEST_ID}.pdf"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/
          git commit -m "Add curriculum ${REQUEST_ID}"
          git push origin HEAD:main

      - name: Upload Curriculum PDF
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curriculum-${{ inputs.track || github.event.client_payload.track }}-${{ github.run_id }}
          path: output/
          retention-days: 30

      - name: Report success
        if: success()
        run: |
          echo "✅ Curriculum generated successfully"
          echo "📧 Ready for: ${{ inputs.user_email || github.event.client_payload.user_email }}"
          echo "📄 Artifact: curriculum-${{ inputs.track || github.event.client_payload.track }}-${{ github.run_id }}"
