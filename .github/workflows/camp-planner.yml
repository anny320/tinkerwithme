name: Camp Planner Agent

# Plans a full-day, multi-age-band camp (e.g. 51 children split 7-9/10-12/13-15)
# and publishes a branded PDF. Triggered from camp-planner.html
# (repository_dispatch: plan-camp) or run manually from the Actions tab.

on:
  repository_dispatch:
    types: [plan-camp]
  workflow_dispatch:
    inputs:
      theme:
        description: 'Camp theme/topic (e.g. "Arduino Robotics & Electronics" or a custom theme)'
        required: true
        default: 'Arduino Robotics & Electronics'
      age_bands:
        description: 'Age bands with head-counts, e.g. 7-9:20,10-12:19,13-15:12'
        required: true
        default: '7-9:20,10-12:19,13-15:12'
      camp_date:
        description: 'Date of the camp (free text, e.g. "Saturday 15 August 2026")'
        required: false
        default: ''
      duration:
        description: 'Camp duration'
        required: true
        type: choice
        default: 'full'
        options:
          - 'full'
          - '180'
          - '240'
      max_group_size:
        description: 'Maximum children per group'
        required: false
        default: '10'
      venue:
        description: 'Venue (optional)'
        required: false
        default: ''
      user_name:
        description: 'Name of the person the plan is prepared for'
        required: false
        default: ''
      user_email:
        description: 'User email for delivery'
        required: true
      request_id:
        description: 'Unique request ID (auto-set by the web form)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  plan-camp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf2.0-0 \
            libffi-dev \
            shared-mime-info \
            fonts-liberation

      - name: Install Python dependencies
        run: pip install anthropic requests python-dotenv weasyprint

      - name: Generate Camp Plan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CAMP_THEME: ${{ inputs.theme || github.event.client_payload.theme }}
          AGE_BANDS: ${{ inputs.age_bands || github.event.client_payload.age_bands }}
          CAMP_DATE: ${{ inputs.camp_date || github.event.client_payload.camp_date }}
          DURATION: ${{ inputs.duration || github.event.client_payload.duration || 'full' }}
          MAX_GROUP_SIZE: ${{ inputs.max_group_size || github.event.client_payload.max_group_size || '10' }}
          VENUE: ${{ inputs.venue || github.event.client_payload.venue }}
          USER_NAME: ${{ inputs.user_name || github.event.client_payload.user_name }}
          USER_EMAIL: ${{ inputs.user_email || github.event.client_payload.user_email }}
        run: python generate_camp_plan.py

      - name: Publish PDF for download
        if: success()
        env:
          REQUEST_ID: ${{ inputs.request_id || github.event.client_payload.request_id || github.run_id }}
        run: |
          PDF=$(find output -name "*.pdf" | head -1)
          if [ -z "$PDF" ]; then
            echo "No PDF found in output/, skipping publish"
            exit 0
          fi
          mkdir -p downloads
          cp "$PDF" "downloads/${REQUEST_ID}.pdf"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/
          git commit -m "Add camp plan ${REQUEST_ID}"
          git push origin HEAD:main

      - name: Upload Camp Plan PDF
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camp-plan-${{ github.run_id }}
          path: output/
          retention-days: 30

      - name: Report success
        if: success()
        run: |
          echo "✅ Camp plan generated successfully"
          echo "📧 Ready for: ${{ inputs.user_email || github.event.client_payload.user_email }}"
