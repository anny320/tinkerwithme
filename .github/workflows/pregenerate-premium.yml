name: Pre-generate Premium Curriculums

# Generates the FULL facilitator curriculum for every premium course (one AI call
# per course) and renders a full-curriculum PDF per course. Uses the Anthropic API.
#
# These are paid content, so they are NEVER committed to this public repo
# (curriculums/ and premium_content/ are git-ignored). The run uploads them as a
# private-ish build artifact that expires after 1 day: download it from the run
# page, save it to the private Google Drive folder, then delete the artifact.
# Note: on a public repo any signed-in GitHub user can download artifacts while
# they exist, which is why retention is kept to 1 day.
#
# Nothing is cached between runs, so each run regenerates the courses you ask
# for — use "only" to limit it (and the API cost) to the courses you need.
#
# Run from the Actions tab → "Pre-generate Premium Curriculums" → Run workflow.

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerate curriculums that already exist'
        required: false
        type: boolean
        default: false
      only:
        description: 'Optional: only these course IDs (space-separated, e.g. "smart-city ai-movie-studio"). Blank = all courses.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  pregenerate-premium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf2.0-0 \
            libffi-dev \
            shared-mime-info \
            fonts-liberation

      - name: Install Python dependencies
        run: pip install anthropic weasyprint

      - name: Generate premium curriculums (AI)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS="${{ inputs.only }}"
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="--force $ARGS"; fi
          echo "Running: python pregenerate_premium.py $ARGS"
          python pregenerate_premium.py $ARGS

      - name: Render full-curriculum PDFs
        run: python generate_premium.py --curriculums

      - name: Upload curriculums (download, save to Drive, then delete)
        uses: actions/upload-artifact@v4
        with:
          name: premium-curriculums
          path: |
            curriculums/
            premium_content/
          retention-days: 1
          if-no-files-found: error
