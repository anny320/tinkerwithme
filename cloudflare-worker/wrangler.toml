name = "tinkerwithme-curriculum"
main = "worker.js"
compatibility_date = "2025-07-01"

# Plain (non-secret) configuration.
# ALLOWED_ORIGIN must exactly match the origin the site is served from so the
# browser's CORS check passes. For GitHub Pages that is the user subdomain,
# NOT including the /tinkerwithme path.
[vars]
GITHUB_OWNER = "anny320"
GITHUB_REPO = "tinkerwithme"
ALLOWED_ORIGIN = "https://anny320.github.io"

# GITHUB_TOKEN is a SECRET — never put it here. Set it after deploy with:
#   wrangler secret put GITHUB_TOKEN
