<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340"><title>Explain AI to Others</title><rect width="800" height="340" fill="#fff"/><rect x="0" y="0" width="800" height="60" fill="#F6F1EA"/><text x="400" y="32" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="23" fill="#220111">Explain AI to Others</text><text x="400" y="51" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="12" fill="#8a8078">AI concept</text><circle cx="170" cy="185" r="26" fill="#FFD23F" stroke="#220111" stroke-width="2.5"/><path d="M135 250 q0 -46 35 -46 q35 0 35 46 z" fill="#F07B1D" stroke="#220111" stroke-width="2.5"/><rect x="250" y="140" width="330" height="80" rx="10" fill="#fff" stroke="#220111" stroke-width="2.5"/><path d="M280 220 l0 20 l22 -20" fill="#fff" stroke="#220111" stroke-width="2.5"/><text x="415" y="172" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="12" fill="#220111">"AI is a computer that learns</text><text x="415" y="196" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="12" fill="#220111">from lots of examples."</text><text x="650" y="170" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="12" fill="#220111">listeners</text><circle cx="630" cy="205" r="13" fill="#2E6CA4" stroke="#220111" stroke-width="2.5"/><circle cx="660" cy="205" r="13" fill="#5E8700" stroke="#220111" stroke-width="2.5"/><circle cx="690" cy="205" r="13" fill="#F07B1D" stroke="#220111" stroke-width="2.5"/><text x="400" y="300" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="13" fill="#5E8700">If you can explain it simply, you really understand it.</text></svg>
