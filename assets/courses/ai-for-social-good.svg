<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450"><title>Using AI to solve a real community problem</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="40" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="26" fill="#220111">Solve a real problem with AI</text>
<!-- community problem -->
<g>
  <rect x="70" y="150" width="180" height="170" rx="16" fill="#FFEDE0" stroke="#220111" stroke-width="2.5"/>
  <circle cx="160" cy="215" r="48" fill="#7FB3E0" stroke="#220111" stroke-width="2.5"/>
  <path d="M120 215 h80 M160 175 v80 M130 190 q30 20 60 0 M130 240 q30 -20 60 0" fill="none" stroke="#fff" stroke-width="2.2"/>
  <ellipse cx="160" cy="215" rx="22" ry="48" fill="none" stroke="#fff" stroke-width="2.2"/>
  <text x="160" y="300" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="15" fill="#220111">A community need</text>
</g>
<line x1="258" y1="230" x2="314" y2="230" stroke="#220111" stroke-width="3"/><path d="M305 224 L314 230 L305 236" fill="none" stroke="#220111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<!-- AI -->
<g>
  <rect x="326" y="192" width="92" height="78" rx="16" fill="#FF7F32" stroke="#220111" stroke-width="2.5"/>
  <text x="372" y="240" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="24" fill="#fff">AI</text>
  <text x="372" y="300" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="15" fill="#220111">+ your idea</text>
</g>
<line x1="426" y1="230" x2="482" y2="230" stroke="#220111" stroke-width="3"/><path d="M473 224 L482 230 L473 236" fill="none" stroke="#220111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<!-- solution / impact -->
<g>
  <rect x="494" y="150" width="240" height="170" rx="16" fill="#F0F7DE" stroke="#220111" stroke-width="2.5"/>
  <path d="M614 262 c-20 -15 -34 -28 -34 -44 a18 18 0 0 1 34 -8 a18 18 0 0 1 34 8 c0 16 -14 29 -34 44z" fill="#E4572E" stroke="#220111" stroke-width="2.5" stroke-linejoin="round"/>
  <g stroke="#5E8700" stroke-width="3" stroke-linecap="round"><line x1="560" y1="185" x2="572" y2="197"/><line x1="668" y1="185" x2="656" y2="197"/></g>
  <text x="614" y="300" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="15" fill="#220111">A solution that helps</text>
</g>
<text x="400" y="406" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="15" fill="#6E5F56">Find a problem you care about, then pitch an AI solution for it.</text>
</svg>
