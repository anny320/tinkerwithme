<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450"><title>Arduino code example with LED circuit</title><rect width="800" height="450" fill="#fff"/><text x="400.0" y="36" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="24" fill="#220111">Make an LED blink</text><rect x="80" y="110" width="420" height="250" rx="12" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="2"/><text x="100" y="140" font-family="monospace" font-size="14" fill="#8CE68C">void setup() {</text><text x="100" y="162" font-family="monospace" font-size="14" fill="#8CE68C">  pinMode(13, OUTPUT);</text><text x="100" y="184" font-family="monospace" font-size="14" fill="#8CE68C">}</text><text x="100" y="206" font-family="monospace" font-size="14" fill="#8CE68C"></text><text x="100" y="228" font-family="monospace" font-size="14" fill="#8CE68C">void loop() {</text><text x="100" y="250" font-family="monospace" font-size="14" fill="#8CE68C">  digitalWrite(13, HIGH);</text><text x="100" y="272" font-family="monospace" font-size="14" fill="#8CE68C">  delay(1000);</text><text x="100" y="294" font-family="monospace" font-size="14" fill="#8CE68C">  digitalWrite(13, LOW);</text><text x="100" y="316" font-family="monospace" font-size="14" fill="#8CE68C">  delay(1000);</text><text x="100" y="338" font-family="monospace" font-size="14" fill="#8CE68C">}</text><circle cx="650" cy="200" r="40" fill="#FFD23F" stroke="#220111" stroke-width="2.5"/><path d="M650 160 q30 40 0 80 q-30 -40 0 -80" fill="none" stroke="#F07B1D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="650" y="290" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="16" fill="#F07B1D">blink!</text></svg>
