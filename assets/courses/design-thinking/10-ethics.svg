<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450"><title>Ethical design principles</title><rect width="800" height="450" fill="#fff"/><text x="400.0" y="36" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="24" fill="#220111">Ethical design: responsibility</text><line x1="400" y1="110" x2="400" y2="300" stroke="#220111" stroke-width="3"/><line x1="280" y1="150" x2="520" y2="150" stroke="#220111" stroke-width="3"/><path d="M280 150 l-30 50 h60 z" fill="#D9ECFA" stroke="#220111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M520 150 l-30 50 h60 z" fill="#E8F0D8" stroke="#220111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="400" cy="100" r="14" fill="#FFD23F" stroke="#220111" stroke-width="2.5"/><rect x="360" y="300" width="80" height="20" rx="6" fill="#220111" stroke="#220111" stroke-width="0"/><text x="280" y="230" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="13" fill="#220111">Benefit</text><text x="520" y="230" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="13" fill="#220111">Harm</text><text x="400" y="360" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="14" fill="#F07B1D">Who benefits? Who is excluded? What is the impact?</text></svg>
