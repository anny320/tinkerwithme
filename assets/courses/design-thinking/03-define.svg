<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450"><title>Problem definition and reframing</title><rect width="800" height="450" fill="#fff"/><text x="400.0" y="36" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="24" fill="#220111">Define: reframe the problem</text><circle cx="230" cy="210" r="90" fill="#F07B1D" stroke="#220111" stroke-width="2.5"/><circle cx="230" cy="210" r="68" fill="#fff" stroke="#220111" stroke-width="2.5"/><circle cx="230" cy="210" r="46" fill="#FFD23F" stroke="#220111" stroke-width="2.5"/><circle cx="230" cy="210" r="24" fill="#fff" stroke="#220111" stroke-width="2.5"/><circle cx="230" cy="210" r="8" fill="#220111" stroke="#220111" stroke-width="0"/><rect x="400" y="150" width="350" height="130" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/><text x="575" y="185" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="16" fill="#220111">Problem statement</text><text x="575" y="215" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="15" fill="#F07B1D">[User] needs [need]</text><text x="575" y="240" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="15" fill="#F07B1D">because [insight]</text><text x="575" y="268" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="12" fill="#9aa0a6">specific · user-focused · actionable</text></svg>
