<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450"><title>City subsystems connected into one smart city</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="40" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="26" fill="#220111">Connect the city's systems</text>
<!-- buildings -->
<g stroke="#220111" stroke-width="2.5">
  <rect x="120" y="190" width="70" height="150" rx="6" fill="#E2EBF5"/>
  <rect x="200" y="150" width="80" height="190" rx="6" fill="#D9ECFA"/>
  <rect x="290" y="215" width="64" height="125" rx="6" fill="#E2EBF5"/>
  <g fill="#FFD23F" stroke="none"><rect x="135" y="205" width="12" height="12"/><rect x="160" y="205" width="12" height="12"/><rect x="135" y="235" width="12" height="12"/><rect x="160" y="235" width="12" height="12"/><rect x="218" y="170" width="12" height="12"/><rect x="245" y="170" width="12" height="12"/><rect x="218" y="200" width="12" height="12"/><rect x="245" y="200" width="12" height="12"/><rect x="305" y="235" width="12" height="12"/><rect x="328" y="235" width="12" height="12"/></g>
</g>
<!-- hub -->
<circle cx="500" cy="235" r="40" fill="#FF7F32" stroke="#220111" stroke-width="2.5"/>
<text x="500" y="230" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="14" fill="#fff">CITY</text>
<text x="500" y="248" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="14" fill="#fff">HUB</text>
<!-- nodes -->
<g stroke="#7FB3E0" stroke-width="2.5"><line x1="460" y1="235" x2="360" y2="235"/><line x1="540" y1="220" x2="620" y2="180"/><line x1="540" y1="250" x2="620" y2="290"/></g>
<g>
  <circle cx="650" cy="170" r="30" fill="#F0F7DE" stroke="#220111" stroke-width="2.5"/>
  <circle cx="650" cy="162" r="6" fill="#E4572E"/><circle cx="650" cy="178" r="6" fill="#84BD00"/>
  <text x="692" y="174" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="13" fill="#220111">Traffic</text>
</g>
<g>
  <circle cx="650" cy="300" r="30" fill="#FFEDE0" stroke="#220111" stroke-width="2.5"/>
  <rect x="642" y="286" width="16" height="22" rx="2" fill="#FF7F32" stroke="#220111" stroke-width="2"/><circle cx="650" cy="280" r="5" fill="#FFD23F" stroke="#220111" stroke-width="2"/>
  <text x="692" y="304" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="13" fill="#220111">Lights</text>
</g>
<text x="300" y="380" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="15" fill="#220111">Each team builds one part…</text>
<text x="400" y="412" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="15" fill="#6E5F56">…then link them all on one shared smart-city grid.</text>
</svg>
