<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 275"><title>Three golden rules: ask a trusted adult, check your sources, and be kind</title><rect width="800" height="275" fill="#fff"/><text x="400" y="38" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="24" fill="#220111">3 golden rules for using AI</text><rect x="25" y="65" width="240" height="190" rx="14" fill="#E4F2C4" stroke="#220111" stroke-width="2.5"/><circle cx="145" cy="125" r="38" fill="#fff" stroke="#220111" stroke-width="2.5"/><text x="145" y="140" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="40" fill="#F07B1D">1</text><text x="145" y="200" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="18" fill="#220111">Ask a trusted adult</text><text x="145" y="224" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="13" fill="#220111">before sharing anything personal</text><rect x="280" y="65" width="240" height="190" rx="14" fill="#FFF4E6" stroke="#220111" stroke-width="2.5"/><circle cx="400" cy="125" r="38" fill="#fff" stroke="#220111" stroke-width="2.5"/><text x="400" y="140" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="40" fill="#F07B1D">2</text><text x="400" y="200" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="18" fill="#220111">Check your sources</text><text x="400" y="224" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="13" fill="#220111">AI can be wrong. Double-check!</text><rect x="535" y="65" width="240" height="190" rx="14" fill="#FBDDE8" stroke="#220111" stroke-width="2.5"/><circle cx="655" cy="125" r="38" fill="#fff" stroke="#220111" stroke-width="2.5"/><text x="655" y="140" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="40" fill="#F07B1D">3</text><text x="655" y="200" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="18" fill="#220111">Be kind</text><text x="655" y="224" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="13" fill="#220111">Never use AI to trick or bully</text></svg>
