y</text><rect x="40" y="85" width="110" height="36" rx="12" fill="#fff" stroke="#220111" stroke-width="2.5"/><path d="M52 120 L58 133 L66 120" fill="#fff" stroke="#220111" stroke-width="2.5" stroke-linejoin="round"/><rect x="53" y="117" width="12" height="5" fill="#fff"/><text x="95.0" y="107.55" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="13" fill="#220111">Hi! Need help?</text><rect x="70" y="140" width="100" height="36" rx="12" fill="#FFD23F" stroke="#220111" stroke-width="2.5"/><path d="M146 175 L152 188 L160 175" fill="#FFD23F" stroke="#220111" stroke-width="2.5" stroke-linejoin="round"/><rect x="147" y="172" width="12" height="5" fill="#FFD23F"/><text x="120.0" y="162.55" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="13" fill="#220111">Yes please!</text><rect x="235" y="88" width="50" height="32" rx="6" fill="#fff" stroke="#220111" stroke-width="2"/><path d="M254 96 l12 8 l-12 8 z" fill="#F07B1D"/><rect x="295" y="94" width="70" height="7" rx="3" fill="#220111" opacity=".7"/><rect x="295" y="106" width="45" height="6" rx="3" fill="#220111" opacity=".35"/><rect x="235" y="130" width="50" height="32" rx="6" fill="#FFD23F" stroke="#220111" stroke-width="2"/><path d="M254 138 l12 8 l-12 8 z" fill="#F07B1D"/><rect x="295" y="136" width="70" height="7" rx="3" fill="#220111" opacity=".7"/><rect x="295" y="148" width="45" height="6" rx="3" fill="#220111" opacity=".35"/><rect x="235" y="172" width="50" height="32" rx="6" fill="#fff" stroke="#220111" stroke-width="2"/><path d="M254 180 l12 8 l-12 8 z" fill="#F07B1D"/><rect x="295" y="178" width="70" height="7" rx="3" fill="#220111" opacity=".7"/><rect x="295" y="190" width="45" height="6" rx="3" fill="#220111" opacity=".35"/><rect x="478" y="90" width="44" height="74" rx="22" fill="#fff" stroke="#220111" stroke-width="2.5"/><path d="M462 140 q38 50 76 0 M500 166 v24 M482 192 h36" stroke="#220111" stroke-width="2.5" fill="none"/><path d="M4