<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270"><title>A text prompt about a robot painting a sunset over Mount Kenya goes into an AI model, which draws the picture</title><rect width="800" height="270" fill="#fff"/><text x="400" y="38" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="24" fill="#220111">Generative AI: words in, picture out</text><rect x="20" y="80" width="250" height="150" rx="14" fill="#FFF4E6" stroke="#220111" stroke-width="2.5"/><text x="145" y="108" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="16" fill="#220111">Your prompt</text><text x="145" y="145" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="15" fill="#220111">&quot;A friendly robot</text><text x="145" y="169" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="15" fill="#220111">painting a sunset</text><text x="145" y="193" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="15" fill="#220111">over Mount Kenya&quot;</text><path d="M275 155 H337" stroke="#220111" stroke-width="3"/><path d="M333 148 L345 155 L333 162 Z" fill="#220111"/><g transform="translate(400 175) scale(1.1)"><path d="M0 -38 v-10" stroke="#220111" stroke-width="3"/><circle cx="0" cy="-50" r="5" fill="#FFD23F" stroke="#220111" stroke-width="2.5"/><rect x="-28" y="-38" width="56" height="44" rx="10" fill="#F07B1D" stroke="#220111" stroke-width="2.5"/><circle cx="-11" cy="-18" r="6" fill="#fff" stroke="#220111" stroke-width="2"/><circle cx="11" cy="-18" r="6" fill="#fff" stroke="#220111" stroke-width="2"/><circle cx="-11" cy="-17" r="2.5" fill="#220111"/><circle cx="11" cy="-17" r="2.5" fill="#220111"/><path d="M-9 -4 q9 7 18 0" stroke="#220111" stroke-width="2.5" fill="none" stroke-linecap="round"/><rect x="-20" y="10" width="40" height="30" rx="7" fill="#F07B1D" stroke="#220111" stroke-width="2.5"/></g><text x="400" y="238" t