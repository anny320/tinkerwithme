<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360"><title>A streetlight that only switches on when it is dark and someone walks past, saving energy</title><rect width="800" height="360" fill="#fff"/><text x="400" y="36" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="24" fill="#220111">Build: smart streetlight</text><rect x="0" y="300" width="800" height="60" fill="#9AA3AD"/><rect x="110" y="110" width="14" height="190" fill="#220111"/><path d="M117 112 h70" stroke="#220111" stroke-width="10" stroke-linecap="round"/><path d="M170 118 l20 0 l12 22 h-44 z" fill="#FFD23F" stroke="#220111" stroke-width="2"/><path d="M160 142 L120 300 H260 L214 142 Z" fill="#FFD23F" opacity=".35"/><circle cx="300" cy="80" r="26" fill="#3A3F6B" stroke="#220111" stroke-width="2"/><circle cx="312" cy="72" r="20" fill="#fff"/><text x="300" y="128" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="13" fill="#220111">dark</text><circle cx="200" cy="230" r="14" fill="#FBDDE8" stroke="#220111" stroke-width="2"/><path d="M200 244 v34 M200 255 l-14 12 M200 255 l14 12 M200 278 l-10 20 M200 278 l10 20" stroke="#220111" stroke-width="3"/><rect x="400" y="70" width="370" height="210" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/><text x="585" y="100" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="16" fill="#220111">The rule</text><text x="420" y="135" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="15" fill="#220111">IF it is dark (LDR)</text><text x="420" y="165" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="15" fill="#220111">AND someone is near (PIR)</text><text x="420" y="195" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="15" fill="#5E8700">THEN light ON</text><text x="420" y="225" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="15" fill="#B23A2A">ELSE light OFF to save energy</text></svg>
