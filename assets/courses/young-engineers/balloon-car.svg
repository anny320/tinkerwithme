<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420"><title>A balloon-powered car made from a box, straws, skewers and bottle-top wheels; air rushing out the back pushes it forward</title><rect width="800" height="420" fill="#fff"/><text x="400" y="36" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="24" fill="#220111">Build: balloon-powered car</text><rect x="20" y="60" width="250" height="170" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/><text x="36" y="88" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="15" fill="#220111">You need</text><rect x="36" y="102" width="14" height="14" rx="3" fill="#fff" stroke="#220111" stroke-width="2"/><text x="60" y="114" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="13.5" fill="#220111">Small juice box or card</text><rect x="36" y="128" width="14" height="14" rx="3" fill="#fff" stroke="#220111" stroke-width="2"/><text x="60" y="140" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="13.5" fill="#220111">2 straws + 2 skewers</text><rect x="36" y="154" width="14" height="14" rx="3" fill="#fff" stroke="#220111" stroke-width="2"/><text x="60" y="166" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="13.5" fill="#220111">4 bottle tops (wheels)</text><rect x="36" y="180" width="14" height="14" rx="3" fill="#fff" stroke="#220111" stroke-width="2"/><text x="60" y="192" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="13.5" fill="#220111">Balloon + tape</text><rect x="36" y="206" width="14" height="14" rx="3" fill="#fff" stroke="#220111" stroke-width="2"/><text x="60" y="218" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="13.5" fill="#220111">Another straw (nozzle)</text><g transform="translate(300 120)"><rect x="40" y="90" width="260" height="70" rx="10" fill="#C89B6D" stroke="#220111" stroke-width="2.5"/><rect x="20" y="168" width="300" height="6" fill="#9AA3AD" stroke="#220111" stroke-width="1.5"/><circle cx="80" cy="172" r="30" fill="#F07B1D" stroke="#220111" stroke-width="2.5"/><circle cx="80" cy="172" r="7" fill="#fff" stroke="#220111" stroke-width="2"/><circle cx="260" cy="172" r="30" fill="#F07B1D" stroke="#220111" stroke-width="2.5"/><circle cx="260" cy="172" r="7" fill="#fff" stroke="#220111" stroke-width="2"/><ellipse cx="150" cy="40" rx="80" ry="48" fill="#FBDDE8" stroke="#220111" stroke-width="2.5"/><path d="M228 44 L330 80" stroke="#220111" stroke-width="7"/><path d="M228 44 L330 80" stroke="#fff" stroke-width="3"/><path d="M350 84 l14 4" stroke="#7FB3E0" stroke-width="3" stroke-linecap="round"/><path d="M372 88 l14 4" stroke="#7FB3E0" stroke-width="3" stroke-linecap="round"/><path d="M394 92 l14 4" stroke="#7FB3E0" stroke-width="3" stroke-linecap="round"/><path d="M30 250 h120" stroke="#220111" stroke-width="3"/><path d="M20 250 l14 -8 v16 z" fill="#220111"/><text x="90" y="275" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="13" fill="#220111">car goes this way</text><text x="400" y="275" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="13" fill="#220111">air pushes out this way</text></g></svg>
