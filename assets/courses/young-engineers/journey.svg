<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 445"><title>Five stages: Explorer 5–7, Junior Maker 8–10, Junior Engineer 11–13, Engineer 14–16, Innovator 16–18, climbing like steps</title><rect width="800" height="445" fill="#fff"/><text x="400" y="38" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="26" fill="#220111">The Young Engineer Journey</text><rect x="20" y="310" width="148" height="90" rx="10" fill="#E4F2C4" stroke="#220111" stroke-width="2.5"/><text x="94" y="348" text-anchor="middle" font-size="28">🌱</text><text x="94" y="372" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="15" fill="#220111">Explorer</text><text x="94" y="392" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="13" fill="#220111">Ages 5–7</text><text x="94" y="425" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="11.5" fill="#220111">“I can make things”</text><rect x="176" y="272" width="148" height="128" rx="10" fill="#FFF4E6" stroke="#220111" stroke-width="2.5"/><text x="250" y="310" text-anchor="middle" font-size="28">🔧</text><text x="250" y="334" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="15" fill="#220111">Junior Maker</text><text x="250" y="354" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="13" fill="#220111">Ages 8–10</text><text x="250" y="425" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="11.5" fill="#220111">“I can solve problems”</text><rect x="332" y="234" width="148" height="166" rx="10" fill="#D9ECFA" stroke="#220111" stroke-width="2.5"/><text x="406" y="272" text-anchor="middle" font-size="28">🤖</text><text x="406" y="296" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="15" fill="#220111">Junior Engineer</text><text x="406" y="316" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="13" fill="#220111">Ages 11–13</text><text x="406" y="425" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="11.5" fill="#220111">“I can design systems”</text><rect x="488" y="196" width="148" height="204" rx="10" fill="#FBDDE8" stroke="#220111" stroke-width="2.5"/><text x="562" y="234" text-anchor="middle" font-size="28">⚙️</text><text x="562" y="258" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="15" fill="#220111">Engineer</text><text x="562" y="278" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="13" fill="#220111">Ages 14–16</text><text x="562" y="425" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="11.5" fill="#220111">“I can engineer solutions”</text><rect x="644" y="158" width="148" height="242" rx="10" fill="#C9B6F2" stroke="#220111" stroke-width="2.5"/><text x="718" y="196" text-anchor="middle" font-size="28">🚀</text><text x="718" y="220" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="15" fill="#220111">Innovator</text><text x="718" y="240" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="13" fill="#220111">Ages 16–18</text><text x="718" y="425" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="11.5" fill="#220111">“I can create solutions”</text><g transform="translate(698 128) scale(0.7)"><path d="M0 -38 v-10" stroke="#220111" stroke-width="3"/><circle cx="0" cy="-50" r="5" fill="#FFD23F" stroke="#220111" stroke-width="2.5"/><rect x="-28" y="-38" width="56" height="44" rx="10" fill="#F07B1D" stroke="#220111" stroke-width="2.5"/><circle cx="-11" cy="-18" r="6" fill="#fff" stroke="#220111" stroke-width="2"/><circle cx="11" cy="-18" r="6" fill="#fff" stroke="#220111" stroke-width="2"/><circle cx="-11" cy="-17" r="2.5" fill="#220111"/><circle cx=