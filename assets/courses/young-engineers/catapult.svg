<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400"><title>A lollipop-stick catapult launching a paper ball, with a tape measure and a results table</title><rect width="800" height="400" fill="#fff"/><text x="400" y="36" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="24" fill="#220111">Build: lollipop-stick catapult</text><rect x="20" y="60" width="250" height="170" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/><text x="36" y="88" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="15" fill="#220111">You need</text><rect x="36" y="102" width="14" height="14" rx="3" fill="#fff" stroke="#220111" stroke-width="2"/><text x="60" y="114" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="13.5" fill="#220111">7 lollipop sticks</text><rect x="36" y="128" width="14" height="14" rx="3" fill="#fff" stroke="#220111" stroke-width="2"/><text x="60" y="140" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="13.5" fill="#220111">4 rubber bands</text><rect x="36" y="154" width="14" height="14" rx="3" fill="#fff" stroke="#220111" stroke-width="2"/><text x="60" y="166" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="13.5" fill="#220111">Bottle top + glue</text><rect x="36" y="180" width="14" height="14" rx="3" fill="#fff" stroke="#220111" stroke-width="2"/><text x="60" y="192" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="13.5" fill="#220111">Paper balls</text><rect x="36" y="206" width="14" height="14" rx="3" fill="#fff" stroke="#220111" stroke-width="2"/><text x="60" y="218" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="13.5" fill="#220111">Tape measure</text><g transform="translate(300 90)"><rect x="20" y="210" width="200" height="14" rx="4" fill="#C89B6D" stroke="#220111" stroke-width="2"/><rect x="40" y="180" width="70" height="30" rx="4" fill="#C89B6D" stroke="#220111" stroke-width="2"/><path d="M30 214 L210 150" stroke="#C89B6D" stroke-width="12" stroke-linecap="round"/><path d="M30 214 L210 150" stroke="#220111" stroke-width="2" fill="none"/><circle cx="205" cy="140" r="14" fill="#F07B1D" stroke="#220111" stroke-width="2"/><path d="M205 125 Q330 -40 450 200" fill="none" stroke="#220111" stroke-width="2.5" stroke-dasharray="8 7"/><circle cx="450" cy="205" r="9" fill="#fff" stroke="#220111" stroke-width="2"/><path d="M205 245 H450" stroke="#F07B1D" stroke-width="3"/><text x="330" y="265" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="13" fill="#220111">measure the distance</text></g><rect x="560" y="60" width="220" height="130" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/><text x="670" y="84" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="14" fill="#220111">Results</text><text x="600" y="108" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="12.5" fill="#220111">Bands  Try1  Try2  Avg</text><text x="600" y="130" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="12.5" fill="#220111">2        __     __     __</text><text x="600" y="152" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="12.5" fill="#220111">3        __     __     __</text><text x="600" y="174" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="12.5" fill="#220111">4        __     __     __</text></svg>
