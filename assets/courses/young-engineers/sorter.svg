<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420"><title>A cardboard ramp with a hole sorts small and big items into two bins, next to a list of requirements</title><rect width="800" height="420" fill="#fff"/><text x="400" y="36" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="24" fill="#220111">Challenge: waste-sorting machine</text><rect x="20" y="60" width="250" height="190" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/><text x="36" y="88" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="15" fill="#220111">Requirements</text><text x="36" y="116" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="13" fill="#220111">✓ Sorts 2 sizes of items</text><text x="36" y="142" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="13" fill="#220111">✓ 8 out of 10 correct</text><text x="36" y="168" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="13" fill="#220111">✓ Fits on a desk</text><text x="36" y="194" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="13" fill="#220111">✓ Costs nothing to make</text><text x="36" y="220" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="13" fill="#220111">✓ Works without a grown-up</text><g transform="translate(300 80)"><path d="M0 30 L300 150" stroke="#C89B6D" stroke-width="20" stroke-linecap="round"/><rect x="120" y="76" width="70" height="10" fill="#fff" stroke="#220111" stroke-width="2" transform="rotate(22 155 81)"/><circle cx="40" cy="20" r="10" fill="#F07B1D" stroke="#220111" stroke-width="2"/><circle cx="80" cy="34" r="20" fill="#5E8700" stroke="#220111" stroke-width="2"/><rect x="120" y="190" width="90" height="80" fill="#FFD23F" stroke="#220111" stroke-width="2.5"/><text x="165" y="236" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="13" fill="#220111">small</text><rect x="300" y="190" width="110" height="80" fill="#E4F2C4" stroke="#220111" stroke-width="2.5"/><text x="355" y="236" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="13" fill="#220111">big</text><path d="M165 110 V180" stroke="#220111" stroke-width="2" stroke-dasharray="5 5"/><text x="250" y="320" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="13" fill="#220111">small items drop through the hole, big ones roll on</text></g></svg>
