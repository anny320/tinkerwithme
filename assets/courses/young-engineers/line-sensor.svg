<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400"><title>A robot with two sensors on a black paper track, and the IF/THEN rules a line follower uses</title><rect width="800" height="400" fill="#fff"/><text x="400" y="36" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="24" fill="#220111">Build: line-follower sensor</text><rect x="20" y="60" width="370" height="320" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/><text x="205" y="90" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="16" fill="#220111">Paper track</text><path d="M70 340 C70 200 330 300 330 130" fill="none" stroke="#220111" stroke-width="18" stroke-linecap="round"/><g transform="translate(150 255) rotate(-30)"><rect x="-30" y="-20" width="60" height="40" rx="8" fill="#F07B1D" stroke="#220111" stroke-width="2.5"/><circle cx="-14" cy="-28" r="7" fill="#5E8700" stroke="#220111" stroke-width="2"/><circle cx="14" cy="-28" r="7" fill="#5E8700" stroke="#220111" stroke-width="2"/></g><rect x="410" y="60" width="370" height="320" rx="14" fill="#D9ECFA" stroke="#220111" stroke-width="2.5"/><text x="595" y="90" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="16" fill="#220111">Robot rules</text><rect x="430" y="110" width="330" height="52" rx="10" fill="#F07B1D" stroke="#220111" stroke-width="2"/><text x="445" y="138" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="14" fill="#220111">IF Left sees line</text><text x="445" y="156" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="13.5" fill="#220111">THEN turn left</text><rect x="430" y="174" width="330" height="52" rx="10" fill="#5E8700" stroke="#220111" stroke-width="2"/><text x="445" y="202" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="14" fill="#220111">IF Right sees line</text><text x="445" y="220" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="13.5" fill="#220111">THEN turn right</text><rect x="430" y="238" width="330" height="52" rx="10" fill="#7FB3E0" stroke="#220111" stroke-width="2"/><text x="445" y="266" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="14" fill="#220111">IF Both see line</text><text x="445" y="284" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="13.5" fill="#220111">THEN go forward</text><rect x="430" y="302" width="330" height="52" rx="10" fill="#FBDDE8" stroke="#220111" stroke-width="2"/><text x="445" y="330" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="14" fill="#220111">IF Neither sees line</text><text x="445" y="348" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="13.5" fill="#220111">THEN stop &amp; search</text></svg>
