<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350"><title>Three paper helicopters with different wing lengths and a bar chart of their fall times</title><rect width="800" height="350" fill="#fff"/><text x="400" y="36" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="24" fill="#220111">Experiment: paper helicopter trade-offs</text><path d="M110 260 v-60 M110 200 l-30 -36 M110 200 l30 -36" stroke="#220111" stroke-width="3" fill="none"/><rect x="98" y="200" width="24" height="70" fill="#FBDDE8" stroke="#220111" stroke-width="2"/><rect x="98" y="262" width="24" height="10" fill="#9AA3AD" stroke="#220111" stroke-width="1.5"/><text x="110" y="300" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="13" fill="#220111">Wings 6 cm</text><path d="M260 260 v-60 M260 200 l-45 -54 M260 200 l45 -54" stroke="#220111" stroke-width="3" fill="none"/><rect x="248" y="200" width="24" height="70" fill="#E4F2C4" stroke="#220111" stroke-width="2"/><rect x="248" y="262" width="24" height="10" fill="#9AA3AD" stroke="#220111" stroke-width="1.5"/><text x="260" y="300" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="13" fill="#220111">Wings 9 cm</text><path d="M410 260 v-60 M410 200 l-60 -72 M410 200 l60 -72" stroke="#220111" stroke-width="3" fill="none"/><rect x="398" y="200" width="24" height="70" fill="#D9ECFA" stroke="#220111" stroke-width="2"/><rect x="398" y="262" width="24" height="10" fill="#9AA3AD" stroke="#220111" stroke-width="1.5"/><text x="410" y="300" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="13" fill="#220111">Wings 12 cm</text><path d="M30 70 V330" stroke="#220111" stroke-width="2"/><text x="36" y="66" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="12" fill="#220111">drop from 2 m</text><rect x="520" y="70" width="260" height="220" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/><text x="650" y="94" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="14" fill="#220111">Fall time (s)</text><rect x="560" y="192" width="40" height="78" fill="#FBDDE8" stroke="#220111" stroke-width="2"/><text x="580" y="187.0" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="12" fill="#220111">1.2</text><rect x="625" y="146" width="40" height="124" fill="#E4F2C4" stroke="#220111" stroke-width="2"/><text x="645" y="141.5" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="12" fill="#220111">1.9</text><rect x="690" y="101" width="40" height="169" fill="#D9ECFA" stroke="#220111" stroke-width="2"/><text x="710" y="96.0" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="12" fill="#220111">2.6</text><text x="650" y="330" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="13" fill="#220111">Longer wings fall slower… but wobble more?</text></svg>
