<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400"><title>A light-up card: an LED taped to card, wired with tape to a coin battery, with a paper-clip switch</title><rect width="800" height="400" fill="#fff"/><text x="400" y="36" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="24" fill="#220111">Build: light-up card</text><rect x="20" y="60" width="250" height="170" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/><text x="36" y="88" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="15" fill="#220111">You need</text><rect x="36" y="102" width="14" height="14" rx="3" fill="#fff" stroke="#220111" stroke-width="2"/><text x="60" y="114" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="13.5" fill="#220111">Card or thick paper</text><rect x="36" y="128" width="14" height="14" rx="3" fill="#fff" stroke="#220111" stroke-width="2"/><text x="60" y="140" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="13.5" fill="#220111">Coin battery (CR2032)</text><rect x="36" y="154" width="14" height="14" rx="3" fill="#fff" stroke="#220111" stroke-width="2"/><text x="60" y="166" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="13.5" fill="#220111">1 LED (any colour)</text><rect x="36" y="180" width="14" height="14" rx="3" fill="#fff" stroke="#220111" stroke-width="2"/><text x="60" y="192" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="13.5" fill="#220111">Tape</text><rect x="36" y="206" width="14" height="14" rx="3" fill="#fff" stroke="#220111" stroke-width="2"/><text x="60" y="218" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="13.5" fill="#220111">Paper clip (switch)</text><rect x="300" y="70" width="470" height="300" rx="14" fill="#FFF8EC" stroke="#220111" stroke-width="2.5"/><path d="M420 120 l35 -30 l35 30 v120 h-