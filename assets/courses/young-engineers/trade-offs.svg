<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 365"><title>Sliders for speed, accuracy, cost and battery life: making the vehicle faster drains the battery. Write down your trade-offs.</title><rect width="800" height="365" fill="#fff"/><text x="400" y="38" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="24" fill="#220111">Challenge: trade-offs</text><rect x="30" y="60" width="740" height="290" rx="14" fill="#D9ECFA" stroke="#220111" stroke-width="2.5"/><text x="70" y="118" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="17" fill="#220111">Speed</text><rect x="230" y="100" width="300" height="22" rx="11" fill="#fff" stroke="#220111" stroke-width="2"/><rect x="230" y="100" width="255" height="22" rx="11" fill="#F07B1D" stroke="#220111" stroke-width="2"/><circle cx="485" cy="111" r="14" fill="#fff" stroke="#220111" stroke-width="2.5"/><text x="70" y="176" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="17" fill="#220111">Accuracy</text><rect x="230" y="158" width="300" height="22" rx="11" fill="#fff" stroke="#220111" stroke-width="2"/><rect x="230" y="158" width="165" height="22" rx="11" fill="#5E8700" stroke="#220111" stroke-width="2"/><circle cx="395" cy="169" r="14" fill="#fff" stroke="#220111" stroke-width="2.5"/><text x="70" y="234" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="17" fill="#220111">Cost</text><rect x="230" y="216" width="300" height="22" rx="11" fill="#fff" stroke="#220111" stroke-width="2"/><rect x="230" y="216" width="105" height="22" rx="11" fill="#FFD23F" stroke="#220111" stroke-width="2"/><circle cx="335" cy="227" r="14" fill="#fff" stroke="#220111" stroke-width="2.5"/><text x="70" y="292" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="17" fill="#220111">Battery life</text><rect x="230" y="274" width="300" height="22" rx="11" fill="#fff" stroke="#220111" stroke-width="2"/><rect x="230" y="274" width="90" height="22" rx="11" fill="#C9B6F2" stroke="#220111" stroke-width="2"/><circle cx="320" cy="285" r="14" fill="#fff" stroke="#220111" stroke-width="2.5"/><rect x="560" y="90" width="190" height="80" rx="12" fill="#fff" stroke="#220111" stroke-width="2.5"/><path d="M572 169 L578 182 L586 169" fill="#fff" stroke="#220111" stroke-width="2.5" stroke-linejoin="round"/><rect x="573" y="166" width="12" height="5" fill="#fff"/><text x="655.0" y="134.9" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="14" fill="#220111">Faster = less battery!</text><text x="400" y="335" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="15" fill="#220111">You can’t max everything. Write down what you gave up, and why.</text></svg>
