<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380"><title>A rover drives from A to B around obstacles. Success is defined first: under 30 seconds, no bumps, 4 times out of 5.</title><rect width="800" height="380" fill="#fff"/><text x="400" y="38" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="24" fill="#220111">Challenge: Autonomous Rover</text><rect x="20" y="60" width="760" height="300" rx="14" fill="#FFF4E6" stroke="#220111" stroke-width="2.5"/><circle cx="80" cy="300" r="30" fill="#5E8700" stroke="#220111" stroke-width="2.5"/><text x="80" y="307" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="22" fill="#fff">A</text><circle cx="715" cy="110" r="30" fill="#F07B1D" stroke="#220111" stroke-width="2.5"/><text x="715" y="117" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="22" fill="#fff">B</text><rect x="200" y="200" width="70" height="90" rx="6" fill="#9AA3AD" stroke="#220111" stroke-width="2.5"/><rect x="380" y="90" width="60" height="120" rx="6" fill="#9AA3AD" stroke="#220111" stroke-width="2.5"/><rect x="520" y="220" width="80" height="70" rx="6" fill="#9AA3AD" stroke="#220111" stroke-width="2.5"/><path d="M110 300 C180 330 300 330 330 250 S 420 250 470 200 S 640 150 685 115" fill="none" stroke="#220111" stroke-width="3" stroke-dasharray="9 8"/><g transform="translate(320 250)"><rect x="-26" y="-18" width="52" height="30" rx="7" fill="#7FB3E0" stroke="#220111" stroke-width="2.5"/><circle cx="-16" cy="14" r="9" fill="#220111"/><circle cx="16" cy="14" r="9" fill="#220111"/><circle cx="10" cy="-6" r="5" fill="#fff" stroke="#220111" stroke-width="2"/></g><rect x="560" y="290" width="200" height="56" rx="10" fill="#fff" stroke="#220111" stroke-width="2.5"/><text x="660" y="312" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="13.5" fill="#220111">Success = under 30 s,</text><text x="660" y="333" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="13.5" fill="#220111">no bumps, 4 times out of 5</text></svg>
