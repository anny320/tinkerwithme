<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410"><title>A cardboard robot arm lifted by water-filled syringes connected with a tube</title><rect width="800" height="410" fill="#fff"/><text x="400" y="36" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="24" fill="#220111">Build: hydraulic robot arm</text><rect x="20" y="60" width="250" height="196" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/><text x="36" y="88" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="15" fill="#220111">You need</text><rect x="36" y="102" width="14" height="14" rx="3" fill="#fff" stroke="#220111" stroke-width="2"/><text x="60" y="114" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="13.5" fill="#220111">Cardboard strips</text><rect x="36" y="128" width="14" height="14" rx="3" fill="#fff" stroke="#220111" stroke-width="2"/><text x="60" y="140" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="13.5" fill="#220111">4 syringes (10 ml)</text><rect x="36" y="154" width="14" height="14" rx="3" fill="#fff" stroke="#220111" stroke-width="2"/><text x="60" y="166" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="13.5" fill="#220111">2 thin tubes</text><rect x="36" y="180" width="14" height="14" rx="3" fill="#fff" stroke="#220111" stroke-width="2"/><text x="60" y="192" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="13.5" fill="#220111">Split pins or skewers</text><rect x="36" y="206" width="14" height="14" rx="3" fill="#fff" stroke="#220111" stroke-width="2"/><text x="60" y="218" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="13.5" fill="#220111">Water + food colour</text><rect x="36" y="232" width="14" height="14" rx="3" fill="#fff" stroke="#220111" stroke-width="2"/><text x="60" y="244" text-anchor="start" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="13.5" fill="#220111">Tape / glue</text><g transform="translate(300 80)"><rect x="0" y="260" width="200" height="22" rx="4" fill="#C89B6D" stroke="#220111" stroke-width="2"/><rect x="80" y="130" width="34" height="132" rx="4" fill="#C89B6D" stroke="#220111" stroke-width="2"/><rect x="97" y="120" width="200" height="30" rx="4" fill="#C89B6D" stroke="#220111" stroke-width="2" transform="rotate(-25 97 135)"/><circle cx="97" cy="135" r="7" fill="#fff" stroke="#220111" stroke-width="2"/><path d="M270 40 l30 -10 M270 40 l26 18" stroke="#220111" stroke-width="6" stroke-linecap="round"/><rect x="130" y="180" width="70" height="18" rx="3" fill="#fff" stroke="#220111" stroke-width="2" transform="rotate(-50 130 190)"/><rect x="134" y="178" width="34" height="14" fill="#7FB3E0" transform="rotate(-50 130 190)"/><path d="M150 230 C220 300 330 300 380 250" fill="none" stroke="#7FB3E0" stroke-width="6"/><rect x="370" y="170" width="18" height="80" rx="3" fill="#fff" stroke="#220111" stroke-width="2"/><rect x="372" y="200" width="14" height="48" fill="#7FB3E0"/><rect x="366" y="160" width="26" height="10" fill="#220111"/><text x="380" y="150" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="14" fill="#F07B1D">push!</text></g><text x="560" y="390" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="15" fill="#220111">Push one syringe → water moves → the arm lifts</text></svg>
