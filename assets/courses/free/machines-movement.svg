<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450"><title>A motor turns gears that move a wheel</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="40" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="26" fill="#220111">Motors, gears &amp; movement</text>
<!-- motor -->
<g>
  <rect x="70" y="175" width="130" height="120" rx="14" fill="#004C97" stroke="#220111" stroke-width="2.5"/>
  <circle cx="135" cy="235" r="34" fill="#fff" stroke="#220111" stroke-width="2.5"/>
  <text x="135" y="246" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="30" fill="#004C97">M</text>
  <text x="135" y="325" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="15" fill="#220111">Motor spins</text>
</g>
<line x1="206" y1="235" x2="262" y2="235" stroke="#220111" stroke-width="3"/>
<path d="M252 229 L262 235 L252 241" fill="none" stroke="#220111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<!-- gears -->
<g>
  <g transform="translate(330 215)" fill="#FFD23F" stroke="#220111" stroke-width="2.5">
    <circle r="40"/>
    <g><rect x="-6" y="-52" width="12" height="13" rx="2"/><rect x="-6" y="39" width="12" height="13" rx="2"/><rect x="-52" y="-6" width="13" height="12" rx="2"/><rect x="39" y="-6" width="13" height="12" rx="2"/><rect x="-42" y="-42" width="12" height="12" rx="2" transform="rotate(45 -36 -36)"/><rect x="30" y="30" width="12" height="12" rx="2" transform="rotate(45 36 36)"/><rect x="30" y="-42" width="12" height="12" rx="2" transform="rotate(-45 36 -36)"/><rect x="-42" y="30" width="12" height="12" rx="2" transform="rotate(-45 -36 36)"/></g>
    <circle r="11" fill="#fff"/>
  </g>
  <g transform="translate(405 275)" fill="#FF7F32" stroke="#220111" stroke-width="2.5">
    <circle r="30"/>
    <g><rect x="-5" y="-40" width="10" height="11" rx="2"/><rect x="-5" y="29" width="10" height="11" rx="2"/><rect x="-40" y="-5" width="11" height="10" rx="2"/><rect x="29" y="-5" width="11" height="10" rx="2"/></g>
    <circle r="9" fill="#fff"/>
  </g>
  <text x="370" y="345" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="15" fill="#220111">Gears pass the turn</text>
</g>
<line x1="470" y1="250" x2="540" y2="250" stroke="#220111" stroke-width="3"/>
<path d="M530 244 L540 250 L530 256" fill="none" stroke="#220111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<!-- wheel / cart -->
<g>
  <rect x="560" y="205" width="170" height="46" rx="10" fill="#84BD00" stroke="#220111" stroke-width="2.5"/>
  <circle cx="595" cy="262" r="22" fill="#220111"/><circle cx="595" cy="262" r="8" fill="#fff"/>
  <circle cx="695" cy="262" r="22" fill="#220111"/><circle cx="695" cy="262" r="8" fill="#fff"/>
  <g stroke="#220111" stroke-width="3" stroke-linecap="round"><path d="M740 215 h18"/><path d="M740 228 h12"/></g>
  <text x="645" y="325" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="15" fill="#220111">And it moves!</text>
</g>
<text x="400" y="406" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="15" fill="#6E5F56">Turn spinning into pushing, lifting and rolling.</text>
</svg>
