<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450"><title>Make sound, sense the world, and read signals</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="40" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="26" fill="#220111">Make sound &amp; sense the world</text>
<!-- sound: speaker + waves -->
<g>
  <rect x="55" y="140" width="200" height="175" rx="18" fill="#FFEDE0" stroke="#220111" stroke-width="2.5"/>
  <path d="M110 205 h22 l26 -22 v70 l-26 -22 h-22 z" fill="#FF7F32" stroke="#220111" stroke-width="2.5" stroke-linejoin="round"/>
  <g stroke="#220111" stroke-width="2.6" fill="none" stroke-linecap="round">
    <path d="M172 200 q14 18 0 36"/><path d="M186 190 q24 28 0 56"/><path d="M200 182 q34 36 0 72"/>
  </g>
  <text x="155" y="348" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="16" fill="#220111">Sound</text>
</g>
<!-- sensors: ultrasonic eyes + object -->
<g>
  <rect x="300" y="140" width="200" height="175" rx="18" fill="#E2EBF5" stroke="#220111" stroke-width="2.5"/>
  <rect x="330" y="195" width="80" height="44" rx="10" fill="#004C97" stroke="#220111" stroke-width="2.5"/>
  <circle cx="350" cy="217" r="12" fill="#fff" stroke="#220111" stroke-width="2.2"/><circle cx="390" cy="217" r="12" fill="#fff" stroke="#220111" stroke-width="2.2"/>
  <g stroke="#5E8700" stroke-width="2.6" fill="none" stroke-linecap="round"><path d="M418 205 q16 12 0 24"/><path d="M432 198 q26 19 0 38"/></g>
  <circle cx="470" cy="217" r="13" fill="#FFD23F" stroke="#220111" stroke-width="2.5"/>
  <text x="400" y="348" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="16" fill="#220111">Sensors</text>
</g>
<!-- signals: waveform -->
<g>
  <rect x="545" y="140" width="200" height="175" rx="18" fill="#F0F7DE" stroke="#220111" stroke-width="2.5"/>
  <polyline points="565,217 590,217 603,175 625,260 645,200 660,217 725,217" fill="none" stroke="#5E8700" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="645" y="348" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="16" fill="#220111">Signals</text>
</g>
<text x="400" y="400" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="15" fill="#6E5F56">Buzzers, microphones and distance sensors — the robot's ears.</text>
</svg>
