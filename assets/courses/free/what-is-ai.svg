<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450"><title>How AI learns from examples to make a guess</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="40" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="26" fill="#220111">AI learns from examples</text>
<g>
  <rect x="55" y="150" width="150" height="150" rx="16" fill="#E2EBF5" stroke="#220111" stroke-width="2.5"/>
  <g transform="translate(100 205)">
    <circle r="22" fill="#FFD23F" stroke="#220111" stroke-width="2.5"/>
    <path d="M-17 -13 L-24 -27 L-9 -18 Z" fill="#FFD23F" stroke="#220111" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M17 -13 L24 -27 L9 -18 Z" fill="#FFD23F" stroke="#220111" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="-8" cy="-2" r="3" fill="#220111"/><circle cx="8" cy="-2" r="3" fill="#220111"/>
    <path d="M-4 7 q4 4 8 0" stroke="#220111" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(150 255)">
    <circle r="16" fill="#84BD00" stroke="#220111" stroke-width="2.5"/>
    <path d="M-12 -10 L-17 -20 L-6 -13 Z" fill="#84BD00" stroke="#220111" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M12 -10 L17 -20 L6 -13 Z" fill="#84BD00" stroke="#220111" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="-6" cy="-1" r="2.2" fill="#220111"/><circle cx="6" cy="-1" r="2.2" fill="#220111"/>
  </g>
  <text x="130" y="330" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="15" fill="#220111">Show lots of examples</text>
</g>
<line x1="220" y1="225" x2="312" y2="225" stroke="#220111" stroke-width="3"/>
<path d="M302 219 L312 225 L302 231" fill="none" stroke="#220111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<g>
  <rect x="325" y="150" width="150" height="150" rx="20" fill="#F7F3F0" stroke="#220111" stroke-width="2.5"/>
  <g stroke="#7FB3E0" stroke-width="1.4">
    <line x1="365" y1="190" x2="435" y2="190"/><line x1="365" y1="190" x2="400" y2="225"/><line x1="365" y1="190" x2="365" y2="260"/>
    <line x1="435" y1="190" x2="400" y2="225"/><line x1="435" y1="190" x2="435" y2="260"/>
    <line x1="365" y1="260" x2="400" y2="225"/><line x1="435" y1="260" x2="400" y2="225"/><line x1="365" y1="260" x2="435" y2="260"/>
  </g>
  <circle cx="365" cy="190" r="8" fill="#004C97" stroke="#220111" stroke-width="2.5"/>
  <circle cx="435" cy="190" r="8" fill="#004C97" stroke="#220111" stroke-width="2.5"/>
  <circle cx="400" cy="225" r="9" fill="#FF7F32" stroke="#220111" stroke-width="2.5"/>
  <circle cx="365" cy="260" r="8" fill="#84BD00" stroke="#220111" stroke-width="2.5"/>
  <circle cx="435" cy="260" r="8" fill="#84BD00" stroke="#220111" stroke-width="2.5"/>
  <text x="400" y="330" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="15" fill="#220111">It finds patterns</text>
</g>
<line x1="490" y1="225" x2="582" y2="225" stroke="#220111" stroke-width="3"/>
<path d="M572 219 L582 225 L572 231" fill="none" stroke="#220111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<g>
  <rect x="595" y="150" width="150" height="150" rx="16" fill="#F0F7DE" stroke="#220111" stroke-width="2.5"/>
  <circle cx="670" cy="205" r="34" fill="#fff" stroke="#220111" stroke-width="2.5"/>
  <path d="M655 206 l10 11 20 -24" fill="none" stroke="#5E8700" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="670" y="265" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="16" fill="#220111">"It's a cat!"</text>
  <text x="670" y="330" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="15" fill="#220111">It makes a guess</text>
</g>
<text x="400" y="406" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="15" fill="#6E5F56">More examples → better guesses. That's machine learning.</text>
</svg>
