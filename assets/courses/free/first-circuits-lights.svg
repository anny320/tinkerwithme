<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450"><title>A simple circuit: battery and button light up an LED</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="40" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="26" fill="#220111">Make your first light glow</text>
<rect x="210" y="150" width="380" height="180" rx="26" fill="none" stroke="#220111" stroke-width="4"/>
<g stroke="#FFC400" stroke-width="4" stroke-linecap="round">
  <line x1="636" y1="205" x2="664" y2="188"/><line x1="648" y1="240" x2="682" y2="240"/><line x1="636" y1="275" x2="664" y2="292"/>
</g>
<g>
  <rect x="178" y="208" width="64" height="44" rx="8" fill="#84BD00" stroke="#220111" stroke-width="2.5"/>
  <rect x="242" y="220" width="7" height="20" rx="2" fill="#220111"/>
  <text x="196" y="236" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="18" fill="#220111">+</text>
  <text x="226" y="236" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="18" fill="#220111">–</text>
  <text x="210" y="298" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="15" fill="#220111">Battery</text>
</g>
<g>
  <rect x="368" y="128" width="64" height="44" rx="10" fill="#FF7F32" stroke="#220111" stroke-width="2.5"/>
  <circle cx="400" cy="150" r="12" fill="#fff" stroke="#220111" stroke-width="2.5"/>
  <text x="400" y="118" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="15" fill="#220111">Press the button</text>
</g>
<g>
  <circle cx="590" cy="240" r="27" fill="#FFD23F" stroke="#220111" stroke-width="2.5"/>
  <path d="M582 246 v-12 l8 7 8 -7 v12" fill="none" stroke="#220111" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="581" y1="267" x2="581" y2="283" stroke="#220111" stroke-width="2.5"/>
  <line x1="599" y1="267" x2="599" y2="283" stroke="#220111" stroke-width="2.5"/>
  <text x="590" y="312" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="15" fill="#220111">It glows!</text>
</g>
<text x="400" y="406" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="15" fill="#6E5F56">Battery → button → LED: a complete loop makes light.</text>
</svg>
