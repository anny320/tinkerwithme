<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450"><title>How a smart robot senses, thinks and acts</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="40" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="26" fill="#220111">Smart robots: sense · think · act</text>
<!-- sense (eye/sensor) -->
<g>
  <rect x="55" y="150" width="150" height="150" rx="18" fill="#E2EBF5" stroke="#220111" stroke-width="2.5"/>
  <path d="M95 225 q35 -32 70 0 q-35 32 -70 0 z" fill="#fff" stroke="#220111" stroke-width="2.5"/>
  <circle cx="130" cy="225" r="15" fill="#004C97" stroke="#220111" stroke-width="2.5"/>
  <circle cx="130" cy="225" r="5" fill="#fff"/>
  <text x="130" y="330" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="16" fill="#220111">Sense</text>
</g>
<line x1="210" y1="225" x2="286" y2="225" stroke="#220111" stroke-width="3"/>
<path d="M276 219 L286 225 L276 231" fill="none" stroke="#220111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<!-- think (chip) -->
<g>
  <rect x="300" y="150" width="150" height="150" rx="18" fill="#F0F7DE" stroke="#220111" stroke-width="2.5"/>
  <rect x="345" y="195" width="60" height="60" rx="8" fill="#FF7F32" stroke="#220111" stroke-width="2.5"/>
  <g stroke="#220111" stroke-width="2.5" stroke-linecap="round">
    <line x1="360" y1="195" x2="360" y2="180"/><line x1="375" y1="195" x2="375" y2="180"/><line x1="390" y1="195" x2="390" y2="180"/>
    <line x1="360" y1="255" x2="360" y2="270"/><line x1="375" y1="255" x2="375" y2="270"/><line x1="390" y1="255" x2="390" y2="270"/>
    <line x1="345" y1="210" x2="330" y2="210"/><line x1="345" y1="240" x2="330" y2="240"/>
    <line x1="405" y1="210" x2="420" y2="210"/><line x1="405" y1="240" x2="420" y2="240"/>
  </g>
  <circle cx="375" cy="225" r="11" fill="#fff" stroke="#220111" stroke-width="2.2"/>
  <text x="375" y="330" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="16" fill="#220111">Think</text>
</g>
<line x1="455" y1="225" x2="531" y2="225" stroke="#220111" stroke-width="3"/>
<path d="M521 219 L531 225 L521 231" fill="none" stroke="#220111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<!-- act (wheels/motor) -->
<g>
  <rect x="545" y="150" width="150" height="150" rx="18" fill="#FFEDE0" stroke="#220111" stroke-width="2.5"/>
  <rect x="575" y="195" width="90" height="36" rx="8" fill="#84BD00" stroke="#220111" stroke-width="2.5"/>
  <circle cx="595" cy="245" r="17" fill="#220111"/><circle cx="595" cy="245" r="6" fill="#fff"/>
  <circle cx="645" cy="245" r="17" fill="#220111"/><circle cx="645" cy="245" r="6" fill="#fff"/>
  <text x="620" y="330" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="16" fill="#220111">Act</text>
</g>
<text x="400" y="406" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="15" fill="#6E5F56">Every robot repeats this loop, fast.</text>
</svg>
