<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450"><title>A written prompt becomes a picture, music and video</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="40" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="26" fill="#220111">Turn words into pictures, music &amp; video</text>
<!-- prompt -->
<g>
  <rect x="55" y="185" width="190" height="90" rx="14" fill="#F7F3F0" stroke="#220111" stroke-width="2.5"/>
  <text x="72" y="222" font-family="'Space Mono',monospace" font-weight="700" font-size="14" fill="#220111">"a space cat</text>
  <text x="72" y="246" font-family="'Space Mono',monospace" font-weight="700" font-size="14" fill="#220111">surfing a comet"</text>
  <text x="150" y="312" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="15" fill="#220111">Your idea</text>
</g>
<line x1="252" y1="230" x2="320" y2="230" stroke="#220111" stroke-width="3"/>
<path d="M310 224 L320 230 L310 236" fill="none" stroke="#220111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<!-- AI -->
<g>
  <rect x="332" y="188" width="92" height="84" rx="16" fill="#FF7F32" stroke="#220111" stroke-width="2.5"/>
  <text x="378" y="238" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="24" fill="#fff">AI</text>
  <text x="378" y="312" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="15" fill="#220111">AI tools</text>
</g>
<g stroke="#220111" stroke-width="3" fill="none" stroke-linecap="round">
  <path d="M430 215 q30 -20 56 -34"/><path d="M430 230 h56"/><path d="M430 245 q30 20 56 34"/>
</g>
<!-- outputs: image, music, video -->
<g>
  <rect x="495" y="150" width="120" height="78" rx="12" fill="#E2EBF5" stroke="#220111" stroke-width="2.5"/>
  <circle cx="525" cy="178" r="8" fill="#FFD23F" stroke="#220111" stroke-width="2"/>
  <path d="M503 216 l24 -26 16 16 12 -12 20 22 z" fill="#84BD00" stroke="#220111" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="635" y="195" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="14" fill="#220111">Picture</text>

  <rect x="495" y="236" width="120" height="44" rx="10" fill="#F0F7DE" stroke="#220111" stroke-width="2.5"/>
  <circle cx="520" cy="262" r="7" fill="#5E8700" stroke="#220111" stroke-width="2"/>
  <path d="M527 262 v-18 l16 -4 v18" fill="none" stroke="#220111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="543" cy="258" r="6" fill="#5E8700" stroke="#220111" stroke-width="2"/>
  <text x="635" y="267" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="14" fill="#220111">Music</text>

  <rect x="495" y="288" width="120" height="44" rx="10" fill="#FFEDE0" stroke="#220111" stroke-width="2.5"/>
  <rect x="512" y="300" width="30" height="20" rx="3" fill="#fff" stroke="#220111" stroke-width="2"/>
  <path d="M542 305 l10 -5 v20 l-10 -5 z" fill="#FF7F32" stroke="#220111" stroke-width="2" stroke-linejoin="round"/>
  <text x="635" y="315" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="14" fill="#220111">Video</text>
</g>
<text x="400" y="408" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="15" fill="#6E5F56">Describe it well, and AI helps you make it.</text>
</svg>
