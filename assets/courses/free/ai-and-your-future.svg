<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450"><title>AI working alongside people in future jobs</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="40" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="26" fill="#220111">AI in the jobs you'll do</text>
<!-- job 1: robot engineer -->
<g>
  <rect x="55" y="120" width="200" height="185" rx="18" fill="#E2EBF5" stroke="#220111" stroke-width="2.5"/>
  <g transform="translate(155 200)">
    <path d="M0 -40 v-9" stroke="#220111" stroke-width="3"/><circle cx="0" cy="-50" r="5" fill="#FFD23F" stroke="#220111" stroke-width="2.5"/>
    <rect x="-30" y="-40" width="60" height="46" rx="11" fill="#FF7F32" stroke="#220111" stroke-width="2.5"/>
    <circle cx="-12" cy="-19" r="7" fill="#fff" stroke="#220111" stroke-width="2"/><circle cx="12" cy="-19" r="7" fill="#fff" stroke="#220111" stroke-width="2"/>
    <circle cx="-12" cy="-18" r="3" fill="#220111"/><circle cx="12" cy="-18" r="3" fill="#220111"/>
    <path d="M-10 -3 q10 7 20 0" stroke="#220111" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <rect x="-22" y="10" width="44" height="30" rx="7" fill="#FF7F32" stroke="#220111" stroke-width="2.5"/>
  </g>
  <text x="155" y="285" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="16" fill="#220111">Robot engineer</text>
</g>
<!-- job 2: AI + health -->
<g>
  <rect x="300" y="120" width="200" height="185" rx="18" fill="#F0F7DE" stroke="#220111" stroke-width="2.5"/>
  <circle cx="400" cy="195" r="42" fill="#fff" stroke="#220111" stroke-width="2.5"/>
  <path d="M400 173 v44 M378 195 h44" stroke="#84BD00" stroke-width="10" stroke-linecap="round"/>
  <text x="400" y="285" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="16" fill="#220111">AI + health</text>
</g>
<!-- job 3: creator -->
<g>
  <rect x="545" y="120" width="200" height="185" rx="18" fill="#FFEDE0" stroke="#220111" stroke-width="2.5"/>
  <g transform="translate(645 198)">
    <rect x="-44" y="-22" width="88" height="48" rx="16" fill="#004C97" stroke="#220111" stroke-width="2.5"/>
    <circle cx="-22" cy="2" r="6" fill="#FFD23F" stroke="#220111" stroke-width="2"/>
    <line x1="-34" y1="2" x2="-10" y2="2" stroke="#fff" stroke-width="3" stroke-linecap="round"/><line x1="-22" y1="-10" x2="-22" y2="14" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="20" cy="-6" r="6" fill="#E4572E" stroke="#220111" stroke-width="2"/><circle cx="32" cy="10" r="6" fill="#84BD00" stroke="#220111" stroke-width="2"/>
  </g>
  <text x="645" y="285" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="16" fill="#220111">Game &amp; film maker</text>
</g>
<text x="400" y="360" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="17" fill="#220111">Almost every job will team up with AI</text>
<text x="400" y="392" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="15" fill="#6E5F56">Learn it now, lead with it later.</text>
</svg>
