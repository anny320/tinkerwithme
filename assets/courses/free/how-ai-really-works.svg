<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450"><title>Data goes in, a model finds patterns, a prediction comes out</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="40" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="26" fill="#220111">Data in, patterns out</text>
<!-- data stack -->
<g>
  <rect x="60" y="175" width="120" height="150" rx="12" fill="#E2EBF5" stroke="#220111" stroke-width="2.5"/>
  <g stroke="#220111" stroke-width="2.5" stroke-linecap="round">
    <line x1="82" y1="205" x2="158" y2="205"/><line x1="82" y1="225" x2="148" y2="225"/><line x1="82" y1="245" x2="158" y2="245"/><line x1="82" y1="265" x2="140" y2="265"/><line x1="82" y1="285" x2="158" y2="285"/>
  </g>
  <text x="120" y="352" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="15" fill="#220111">Lots of data</text>
</g>
<line x1="186" y1="250" x2="262" y2="250" stroke="#220111" stroke-width="3"/>
<path d="M252 244 L262 250 L252 256" fill="none" stroke="#220111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<!-- model (neural net) -->
<g>
  <rect x="278" y="160" width="244" height="180" rx="18" fill="#F7F3F0" stroke="#220111" stroke-width="2.5"/>
  <g stroke="#7FB3E0" stroke-width="1.4">
    <line x1="330" y1="200" x2="400" y2="200"/><line x1="330" y1="200" x2="400" y2="250"/><line x1="330" y1="200" x2="400" y2="300"/>
    <line x1="330" y1="250" x2="400" y2="200"/><line x1="330" y1="250" x2="400" y2="250"/><line x1="330" y1="250" x2="400" y2="300"/>
    <line x1="330" y1="300" x2="400" y2="200"/><line x1="330" y1="300" x2="400" y2="250"/><line x1="330" y1="300" x2="400" y2="300"/>
    <line x1="400" y1="200" x2="470" y2="250"/><line x1="400" y1="250" x2="470" y2="250"/><line x1="400" y1="300" x2="470" y2="250"/>
  </g>
  <g fill="#004C97" stroke="#220111" stroke-width="2.2"><circle cx="330" cy="200" r="9"/><circle cx="330" cy="250" r="9"/><circle cx="330" cy="300" r="9"/></g>
  <g fill="#FF7F32" stroke="#220111" stroke-width="2.2"><circle cx="400" cy="200" r="9"/><circle cx="400" cy="250" r="9"/><circle cx="400" cy="300" r="9"/></g>
  <circle cx="470" cy="250" r="10" fill="#84BD00" stroke="#220111" stroke-width="2.2"/>
  <text x="400" y="365" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="15" fill="#220111">A model finds patterns</text>
</g>
<line x1="528" y1="250" x2="604" y2="250" stroke="#220111" stroke-width="3"/>
<path d="M594 244 L604 250 L594 256" fill="none" stroke="#220111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<!-- prediction -->
<g>
  <rect x="620" y="200" width="130" height="100" rx="14" fill="#F0F7DE" stroke="#220111" stroke-width="2.5"/>
  <text x="685" y="248" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="24" fill="#5E8700">92%</text>
  <text x="685" y="275" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="13" fill="#220111">best guess</text>
  <text x="685" y="352" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="15" fill="#220111">A prediction</text>
</g>
<text x="400" y="408" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="15" fill="#6E5F56">No magic — just patterns learned from examples.</text>
</svg>
