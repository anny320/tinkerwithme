<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450"><title>Understand AI, create with it, and use it kindly</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="40" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="26" fill="#220111">Learn AI — and use it kindly</text>
<!-- tile 1: understand (cog) -->
<g>
  <rect x="55" y="130" width="200" height="175" rx="18" fill="#E2EBF5" stroke="#220111" stroke-width="2.5"/>
  <g transform="translate(155 205)" fill="#004C97" stroke="#220111" stroke-width="2.5">
    <circle r="34"/>
    <g fill="#004C97" stroke="#220111" stroke-width="2.5">
      <rect x="-7" y="-46" width="14" height="14" rx="2"/><rect x="-7" y="32" width="14" height="14" rx="2"/>
      <rect x="-46" y="-7" width="14" height="14" rx="2"/><rect x="32" y="-7" width="14" height="14" rx="2"/>
      <rect x="-37" y="-37" width="13" height="13" rx="2" transform="rotate(45 -30 -30)"/><rect x="24" y="24" width="13" height="13" rx="2" transform="rotate(45 30 30)"/>
    </g>
    <circle r="13" fill="#fff"/>
  </g>
  <text x="155" y="340" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="16" fill="#220111">Understand it</text>
</g>
<!-- tile 2: create (sparkles) -->
<g>
  <rect x="300" y="130" width="200" height="175" rx="18" fill="#F0F7DE" stroke="#220111" stroke-width="2.5"/>
  <g transform="translate(400 205)">
    <path d="M0 -36 l9 24 24 9 -24 9 -9 24 -9 -24 -24 -9 24 -9 z" fill="#FFD23F" stroke="#220111" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M38 -22 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" fill="#84BD00" stroke="#220111" stroke-width="2"/>
    <path d="M-40 18 l3.5 9 9 3.5 -9 3.5 -3.5 9 -3.5 -9 -9 -3.5 9 -3.5 z" fill="#FF7F32" stroke="#220111" stroke-width="2"/>
  </g>
  <text x="400" y="340" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="16" fill="#220111">Create with it</text>
</g>
<!-- tile 3: kindly (shield + heart) -->
<g>
  <rect x="545" y="130" width="200" height="175" rx="18" fill="#FFEDE0" stroke="#220111" stroke-width="2.5"/>
  <path d="M645 165 l34 13 v28 c0 26 -18 42 -34 50 c-16 -8 -34 -24 -34 -50 v-28 z" fill="#fff" stroke="#220111" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M645 250 c-14 -10 -22 -19 -22 -29 a11 11 0 0 1 22 -5 a11 11 0 0 1 22 5 c0 10 -8 19 -22 29 z" fill="#E4572E" stroke="#220111" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="645" y="340" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="700" font-size="16" fill="#220111">Use it kindly</text>
</g>
<text x="400" y="406" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="15" fill="#6E5F56">You're the thinker — AI is your tool.</text>
</svg>
