<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450"><title>A wearable gadget you build, code and wear</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="40" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="800" font-size="26" fill="#220111">Tech you can wear</text>
<!-- wrist band -->
<g>
  <path d="M300 150 q-40 0 -40 60 v30 q0 60 40 60" fill="none" stroke="#004C97" stroke-width="20" stroke-linecap="round"/>
  <path d="M470 150 q40 0 40 60 v30 q0 60 -40 60" fill="none" stroke="#004C97" stroke-width="20" stroke-linecap="round"/>
  <rect x="300" y="178" width="170" height="124" rx="22" fill="#F7F3F0" stroke="#220111" stroke-width="2.5"/>
  <!-- LEDs -->
  <circle cx="335" cy="212" r="10" fill="#E4572E" stroke="#220111" stroke-width="2"/>
  <circle cx="365" cy="212" r="10" fill="#FFD23F" stroke="#220111" stroke-width="2"/>
  <circle cx="395" cy="212" r="10" fill="#84BD00" stroke="#220111" stroke-width="2"/>
  <!-- heart sensor -->
  <path d="M400 268 c-12 -9 -19 -16 -19 -25 a10 10 0 0 1 19 -4 a10 10 0 0 1 19 4 c0 9 -7 16 -19 25z" fill="#E4572E" stroke="#220111" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M322 255 h20 l6 -12 8 24 6 -12 h18" fill="none" stroke="#5E8700" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- glow -->
<g stroke="#FFC400" stroke-width="3.5" stroke-linecap="round"><line x1="520" y1="180" x2="548" y2="166"/><line x1="534" y1="210" x2="566" y2="210"/><line x1="520" y1="240" x2="548" y2="254"/></g>
<text x="400" y="360" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="600" font-size="16" fill="#220111">Lights up and reacts to you</text>
<text x="400" y="392" text-anchor="middle" font-family="Jost,Arial,sans-serif" font-weight="500" font-size="15" fill="#6E5F56">Design, wire and code a gadget — then wear it home.</text>
</svg>
