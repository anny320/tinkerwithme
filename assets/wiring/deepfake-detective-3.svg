<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Jost, sans-serif">
<rect x="0" y="0" width="800" height="300" fill="#FBF7F2"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#220111"/></marker></defs>

<text x="30" y="34" font-family="Space Mono, ui-monospace, monospace" font-size="16" font-weight="700" fill="#220111">Build a detector · train, test, check for bias</text>
<text x="30" y="56" font-family="Jost, sans-serif" font-size="14" font-weight="500" fill="#6E5F56">Show an AI lots of real and fake faces — then test it on pictures it has never seen.</text>

<!-- two class bins -->
<rect x="30" y="84" width="180" height="60" rx="12" fill="#fff" stroke="#220111" stroke-width="2.5"/>
<text x="48" y="110" font-size="14" font-weight="700" fill="#004C97">🙂 Real</text><text x="48" y="132" font-size="11.5" font-weight="500" fill="#6E5F56">15+ real face photos</text>
<rect x="30" y="152" width="180" height="60" rx="12" fill="#fff" stroke="#220111" stroke-width="2.5"/>
<text x="48" y="178" font-size="14" font-weight="700" fill="#7A3FB0">🤖 AI-Generated</text><text x="48" y="200" font-size="11.5" font-weight="500" fill="#6E5F56">15+ AI face photos</text>

<path d="M210 114 C240 114, 250 148, 282 148" stroke="#220111" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<path d="M210 182 C240 182, 250 148, 282 148" stroke="#220111" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>

<rect x="296" y="118" width="150" height="60" rx="12" fill="#5CB1D6" stroke="#220111" stroke-width="2.5"/>
<text x="371" y="144" text-anchor="middle" font-size="24">🧠</text>
<text x="371" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#06384a">Train Model</text>

<path d="M446 148 H490" stroke="#220111" stroke-width="2.5" marker-end="url(#ar)"/>

<rect x="504" y="100" width="266" height="96" rx="12" fill="#fff" stroke="#220111" stroke-width="2.5"/>
<text x="524" y="126" font-size="13" font-weight="700" fill="#220111">Test on a NEW photo 👁️</text>
<rect x="524" y="140" width="170" height="18" rx="4" fill="#e7e0d8"/><rect x="524" y="140" width="138" height="18" rx="4" fill="#004C97"/>
<text x="700" y="154" font-size="11" font-weight="700" fill="#004C97">Real 82%</text>
<rect x="524" y="166" width="170" height="18" rx="4" fill="#e7e0d8"/><rect x="524" y="166" width="31" height="18" rx="4" fill="#7A3FB0"/>
<text x="700" y="180" font-size="11" font-weight="700" fill="#7A3FB0">AI 18%</text>

<rect x="30" y="228" width="740" height="48" rx="12" fill="#FBEDEC" stroke="#C23B3B" stroke-width="2.5"/>
<text x="400" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#C23B3B">Dataset bias: the model only knows what you showed it.</text>
<text x="400" y="268" text-anchor="middle" font-size="12" font-weight="600" fill="#8f2d2d">Test on NEW images (not training ones) — and vary your data so it isn't one-sided.</text>
</svg>
