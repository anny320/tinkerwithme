<path d="M317 104 V111 H300" stroke="#2E7DE0" stroke-width="3.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<!-- 10k to GND -->
<path d="M317 111 L317 128 L328 135 L306 142 L328 149 L306 156 L328 163 L317 170 L317 186" stroke="#220111" stroke-width="2.8" fill="none" stroke-linejoin="round"/>
