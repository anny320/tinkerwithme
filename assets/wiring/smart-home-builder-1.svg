<rect x="186" y="320" width="22" height="15" rx="2" fill="#E8B23A" stroke="#7A5A12" stroke-width="2"/><text x="180" y="332" text-anchor="end" fill="#EAF7F5" font-size="12" font-weight="700">D8</text>
<path d="M208 327 L360 327" stroke="#2E7DE0" stroke-width="3.4" fill="none" stroke-linecap="round"/>
<path d="M360 327 L371 334 L382 320 L393 334 L404 320 L415 334 L426 327" stroke="#220111" stroke-width="3" fill="none" stroke-linejoin="round"/>
<text x="393" y="314" text-anchor="middle" fill="#6E5F56" font-size="10.5" font-weight="700">220Ω</text>
<path d="M426 327 H444" stroke="#220111" stroke-width="3" stroke-linecap="round"/>
<circle cx="458" cy="327" r="13" fill="#E24A3B" stroke="#220111" stroke-width="2.6"/>
