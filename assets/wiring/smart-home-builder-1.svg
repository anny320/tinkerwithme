<path d="M317 186 H700" stroke="#3A3A3A" stroke-width="3" fill="none" stroke-linecap="round"/>

<!-- D7: relay -> room LED -->
<rect x="186" y="186" width="22" height="15" rx="2" fill="#E8B23A" stroke="#7A5A12" stroke-width="2"/><text x="180" y="198" text-anchor="end" fill="#EAF7F5" font-size="12" font-weight="700">D7</text>
<path d="M208 193 H440" stroke="#2E7DE0" stroke-width="3.4" fill="none" stroke-linecap="round"/>
<rect x="440" y="170" width="130" height="48" rx="7" fill="#7A3B2E" stroke="#431d16" stroke-width="3"/>
<text x="505" y="190" text-anchor="middle" fill="#f3ded7" font-size="11.5" font-weight="700">RELAY (IN=LOW on)</text>
<text x="505" y="205" text-anchor="middle" fill="#d6b3a8" font-size="10" font-weight="700">switches the room light</text>
<circle cx="600" cy="194" r="13" fill="#E8B23A" stroke="#220111" stroke-width="2.6"/>
<text x="620" y="198" fill="#220111" font-size="11" font-weight="700">room LED</text>
