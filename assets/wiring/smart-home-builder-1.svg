<path d="M613 194 L648 194 L648 178 L740 178" stroke="#D8322B" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>

<!-- D2: PIR -->
<rect x="186" y="264" width="22" height="15" rx="2" fill="#E8B23A" stroke="#7A5A12" stroke-width="2"/><text x="180" y="276" text-anchor="end" fill="#EAF7F5" font-size="12" font-weight="700">D2</text>
<path d="M208 271 H440" stroke="#2E7DE0" stroke-width="3.4" fill="none" stroke-linecap="round"/>
<rect x="440" y="248" width="130" height="46" rx="7" fill="#355E8C" stroke="#1d3450" stroke-width="3"/>
<text x="505" y="268" text-anchor="middle" fill="#dbe8f5" font-size="11.5" font-weight="700">PIR MOTION</text>
<text x="505" y="283" text-anchor="middle" fill="#aec6de" font-size="10" font-weight="700">OUT · VCC · GND</text>
