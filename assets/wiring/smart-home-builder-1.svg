<path d="M472 327 L472 345 L700 345" stroke="#3A3A3A" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>

<!-- Arduino GND -->
<rect x="186" y="360" width="22" height="15" rx="2" fill="#9AA0A6" stroke="#4a4f54" stroke-width="2"/><text x="180" y="372" text-anchor="end" fill="#EAF7F5" font-size="11" font-weight="700">GND</text>
<path d="M208 367 L224 367 L224 420 L700 420" stroke="#3A3A3A" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>

<text x="40" y="38" fill="#220111" font-size="17" font-weight="700">Smart Home · Session 1 — Smart lighting</text>
<text x="40" y="56" fill="#6E5F56" font-size="12" font-weight="700">LDR senses dark · relay switches the light · PIR lights the hallway.</text>
</svg>
