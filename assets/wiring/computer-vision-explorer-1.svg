<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="Jost, sans-serif">
<rect x="0" y="0" width="800" height="320" fill="#FBF7F2"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#220111"/></marker></defs>

<text x="30" y="34" font-family="Space Mono, ui-monospace, monospace" font-size="16" font-weight="700" fill="#220111">👁️ Computer Vision Explorer · how an app sees</text>
<text x="30" y="56" font-family="Jost, sans-serif" font-size="14" font-weight="500" fill="#6E5F56">Train a model, then wire it into a real webpage that reacts to your camera — live.</text>

<!-- 1 Camera -->
<rect x="30" y="86" width="165" height="104" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/>
<circle cx="54" cy="112" r="15" fill="#004C97"/><text x="54" y="117" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text>
<text x="175" y="124" text-anchor="end" font-size="28">📷</text>
<text x="46" y="162" font-size="16" font-weight="700" fill="#220111">Camera</text>
<text x="46" y="182" font-size="11.5" font-weight="500" fill="#6E5F56">live webcam feed</text>

<!-- 2 Model -->
<rect x="222" y="86" width="165" height="104" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/>
<circle cx="246" cy="112" r="15" fill="#7A3FB0"/><text x="246" y="117" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text>
<text x="367" y="124" text-anchor="end" font-size="28">🧠</text>
<text x="238" y="162" font-size="16" font-weight="700" fill="#220111">Your model</text>
<text x="238" y="182" font-size="11.5" font-weight="500" fill="#6E5F56">Teachable Machine</text>

<!-- 3 Code -->
<rect x="414" y="86" width="165" height="104" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/>
<circle cx="438" cy="112" r="15" fill="#5E8700"/><text x="438" y="117" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text>
<text x="559" y="124" text-anchor="end" font-size="28">⚙️</text>
<text x="430" y="162" font-size="16" font-weight="700" fill="#220111">Code (ml5.js)</text>
<text x="430" y="182" font-size="11.5" font-weight="500" fill="#6E5F56">if confidence &gt; 85%</text>

<!-- 4 Action -->
<rect x="606" y="86" width="165" height="104" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/>
<circle cx="630" cy="112" r="15" fill="#E0641B"/><text x="630" y="117" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text>
<text x="751" y="124" text-anchor="end" font-size="28">🎬</text>
<text x="622" y="162" font-size="16" font-weight="700" fill="#220111">Action</text>
<text x="622" y="182" font-size="11.5" font-weight="500" fill="#6E5F56">next slide / sort waste</text>

<path d="M195 138 H218" stroke="#220111" stroke-width="3" marker-end="url(#ar)"/>
<path d="M387 138 H410" stroke="#220111" stroke-width="3" marker-end="url(#ar)"/>
<path d="M579 138 H602" stroke="#220111" stroke-width="3" marker-end="url(#ar)"/>

<text x="30" y="226" font-family="Jost, sans-serif" font-size="13" font-weight="600" fill="#220111">Garbage in, garbage out — a model only learns what your photos show. Vary background, lighting &amp; angle.</text>
<rect x="30" y="244" width="741" height="52" rx="12" fill="#F0F7DE" stroke="#5E8700" stroke-width="2.5"/>
<text x="64" y="282" text-anchor="middle" font-size="24">🚫</text>
<text x="92" y="267" font-size="13.5" font-weight="700" fill="#3f5c00">Always add a "background / nothing" class</text>
<text x="92" y="286" font-size="12" font-weight="500" fill="#5E8700">…so your app doesn't false-trigger when nothing relevant is on camera.</text>
</svg>
