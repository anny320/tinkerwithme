<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Jost, sans-serif">
<rect x="0" y="0" width="800" height="300" fill="#FBF7F2"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#220111"/></marker></defs>

<text x="30" y="34" font-family="Space Mono, ui-monospace, monospace" font-size="16" font-weight="700" fill="#220111">Design · the brainstorm prompt recipe</text>
<text x="30" y="56" font-family="Jost, sans-serif" font-size="14" font-weight="500" fill="#6E5F56">A good prompt gives AI a job, a theme and clear limits — then you pick the best idea.</text>

<g font-family="Jost, sans-serif" text-anchor="middle">
<rect x="30" y="86" width="175" height="54" rx="12" fill="#E0641B"/><text x="117" y="110" font-size="13.5" font-weight="700" fill="#fff">Who it is for</text><text x="117" y="128" font-size="11" font-weight="500" fill="#ffe7d6">players aged 10–14</text>
<rect x="215" y="86" width="175" height="54" rx="12" fill="#004C97"/><text x="302" y="110" font-size="13.5" font-weight="700" fill="#fff">Theme</text><text x="302" y="128" font-size="11" font-weight="500" fill="#d6e4f5">e.g. Kenyan wildlife</text>
<rect x="400" y="86" width="175" height="54" rx="12" fill="#5E8700"/><text x="487" y="110" font-size="13.5" font-weight="700" fill="#fff">Genre</text><text x="487" y="128" font-size="11" font-weight="500" fill="#e4f0cf">collector / arcade</text>
<rect x="585" y="86" width="185" height="54" rx="12" fill="#7A3FB0"/><text x="677" y="110" font-size="13.5" font-weight="700" fill="#fff">Keep it simple</text><text x="677" y="128" font-size="11" font-weight="500" fill="#eaddf5">move + score + win</text>
</g>

<path d="M400 152 V176" stroke="#220111" stroke-width="3" marker-end="url(#ar)"/>
<rect x="250" y="184" width="300" height="56" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/>
<text x="400" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#220111">ChatGPT → 5 game ideas</text>
<text x="400" y="230" text-anchor="middle" font-size="12" font-weight="500" fill="#6E5F56">read them, then ⭐ pick the one you can build</text>

<text x="400" y="274" text-anchor="middle" font-family="Jost, sans-serif" font-size="12.5" font-weight="600" fill="#9b8c84">Too big? Ask ChatGPT to "simplify this so it only needs movement and a score counter."</text>
</svg>
