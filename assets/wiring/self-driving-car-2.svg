<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="Space Mono, ui-monospace, monospace">
<rect x="0" y="0" width="800" height="430" fill="#FBF7F2"/>
<!-- rails -->
<path d="M700 70 V404" stroke="#3A3A3A" stroke-width="5" stroke-linecap="round"/>
<text x="693" y="62" text-anchor="end" fill="#6E5F56" font-size="12.5" font-weight="700">GND (−)</text>
<path d="M740 70 V404" stroke="#D8322B" stroke-width="5" stroke-linecap="round"/>
<text x="747" y="62" text-anchor="start" fill="#D8322B" font-size="12.5" font-weight="700">5V (+)</text>

<!-- Arduino -->
<rect x="40" y="86" width="150" height="250" rx="12" fill="#0E7C86" stroke="#09434A" stroke-width="4"/>
<rect x="20" y="106" width="24" height="40" rx="3" fill="#C3C7CB" stroke="#5a5f63" stroke-width="2"/>
<text x="115" y="316" text-anchor="middle" fill="#EAF7F5" font-size="14" font-weight="700">ARDUINO</text>
<text x="115" y="332" text-anchor="middle" fill="#EAF7F5" font-size="14" font-weight="700">UNO</text>

<!-- A0 <- left IR OUT -->
<rect x="186" y="130" width="22" height="15" rx="2" fill="#E8B23A" stroke="#7A5A12" stroke-width="2"/>
<text x="180" y="142" text-anchor="end" fill="#EAF7F5" font-size="12" font-weight="700">A0</text>
<path d="M208 137 L470 137" stroke="#2E7DE0" stroke-width="3.6" fill="none" stroke-linecap="round"/>
<!-- A1 <- right IR OUT -->
<rect x="186" y="210" width="22" height="15" rx="2" fill="#E8B23A" stroke="#7A5A12" stroke-width="2"/>
<text x="180" y="222" text-anchor="end" fill="#EAF7F5" font-size="12" font-weight="700">A1</text>
<path d="M208 217 L470 217" stroke="#2E7DE0" stroke-width="3.6" fill="none" stroke-linecap="round"/>

<!-- left IR sensor module -->
<rect x="470" y="104" width="150" height="66" rx="8" fill="#5B3A82" stroke="#331f4d" stroke-width="3.5"/>
<text x="545" y="124" text-anchor="middle" fill="#EAE2F3" font-size="12" font-weight="700">IR SENSOR</text>
<text x="545" y="139" text-anchor="middle" fill="#C9B7E0" font-size="10.5" font-weight="700">left</text>
<text x="545" y="160" text-anchor="middle" fill="#C9B7E0" font-size="10" font-weight="700">OUT · VCC · GND</text>
<!-- OUT pad -->
<circle cx="470" cy="137" r="4" fill="#2E7DE0"/>
<!-- VCC to 5V rail -->
<path d="M600 128 L660 128 L660 92 L740 92" stroke="#D8322B" stroke-width="3.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<!-- GND to GND rail -->
<path d="M600 150 L676 150 L676 92 L700 92" stroke="#3A3A3A" stroke-width="3.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>

<!-- right IR sensor module -->
<rect x="470" y="184" width="150" height="66" rx="8" fill="#5B3A82" stroke="#331f4d" stroke-width="3.5"/>
<text x="545" y="204" text-anchor="middle" fill="#EAE2F3" font-size="12" font-weight="700">IR SENSOR</text>
<text x="545" y="219" text-anchor="middle" fill="#C9B7E0" font-size="10.5" font-weight="700">right</text>
<text x="545" y="240" text-anchor="middle" fill="#C9B7E0" font-size="10" font-weight="700">OUT · VCC · GND</text>
<circle cx="470" cy="217" r="4" fill="#2E7DE0"/>
<path d="M600 208 L648 208 L648 108 L740 108" stroke="#D8322B" stroke-width="3.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M600 230 L664 230 L664 112 L700 112" stroke="#3A3A3A" stroke-width="3.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>

<!-- Arduino 5V + GND to rails -->
<rect x="186" y="276" width="22" height="15" rx="2" fill="#E24A3B" stroke="#7a2018" stroke-width="2"/>
<text x="180" y="288" text-anchor="end" fill="#EAF7F5" font-size="11" font-weight="700">5V</text>
<path d="M208 283 L240 283 L240 390 L740 390" stroke="#D8322B" stroke-width="3.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="186" y="302" width="22" height="15" rx="2" fill="#9AA0A6" stroke="#4a4f54" stroke-width="2"/>
<text x="180" y="314" text-anchor="end" fill="#EAF7F5" font-size="11" font-weight="700">GND</text>
<path d="M208 309 L224 309 L224 374 L700 374" stroke="#3A3A3A" stroke-width="3.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>

<!-- track hint -->
<rect x="250" y="356" width="120" height="8" rx="2" fill="#220111"/>
<text x="310" y="382" text-anchor="middle" fill="#6E5F56" font-size="10.5" font-weight="700">black line on white floor</text>

<!-- title -->
<text x="40" y="40" fill="#220111" font-size="17" font-weight="700">Self-Driving Car · Session 2 — Follow the line</text>
<text x="40" y="58" fill="#6E5F56" font-size="12" font-weight="700">Two IR sensors read the floor. Black absorbs IR, white reflects it.</text>
</svg>
