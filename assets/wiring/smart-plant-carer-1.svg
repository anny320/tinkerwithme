<path d="M208 337 L224 337 L224 384 L700 384" stroke="#3A3A3A" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>

<text x="40" y="38" fill="#220111" font-size="17" font-weight="700">Smart Plant Carer · Self-watering</text>
<text x="40" y="56" fill="#6E5F56" font-size="12" font-weight="700">Dry soil (A0) → relay runs the pump; a status LED glows while watering.</text>
