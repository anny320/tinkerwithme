<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 272" font-family="Jost, sans-serif">
<rect x="0" y="0" width="800" height="272" fill="#FBF7F2"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#220111"/></marker></defs>
<text x="150" y="50" font-family="Space Mono, ui-monospace, monospace" font-size="11" font-weight="700" fill="#004C97" text-anchor="middle">1</text><rect x="60.0" y="60" width="180" height="116" rx="14" fill="#fff" stroke="#004C97" stroke-width="3"/><text x="150" y="100" font-size="30" text-anchor="middle">📥</text><text x="150" y="124" font-family="Jost, sans-serif" font-size="15.5" font-weight="700" fill="#220111" text-anchor="middle">INPUT</text><text x="150" y="144" font-family="Jost, sans-serif" font-size="12" font-weight="500" fill="#6E5F56" text-anchor="middle">what you give it</text><text x="150" y="160" font-family="Jost, sans-serif" font-size="12" font-weight="500" fill="#6E5F56" text-anchor="middle">(your dates, photo…)</text><path d="M242 118 H316" stroke="#220111" stroke-width="3" marker-end="url(#ar)"/><text x="400" y="50" font-family="Space Mono, ui-monospace, monospace" font-size="11" font-weight="700" fill="#E0641B" text-anchor="middle">2</text><rect x="310.0" y="60" width="180" height="116" rx="14" fill="#fff" stroke="#E0641B" stroke-width="3"/><text x="400" y="100" font-size="30" text-anchor="middle">⚙️</text><text x="400" y="124" font-family="Jost, sans-serif" font-size="15.5" font-weight="700" fill="#220111" text-anchor="middle">AI SYSTEM</text><text x="400" y="144" font-family="Jost, sans-serif" font-size="12" font-weight="500" fill="#6E5F56" text-anchor="middle">it works</text><text x="400" y="160" font-family="Jost, sans-serif" font-size="12" font-weight="500" fill="#6E5F56" text-anchor="middle">something out</text><path d="M492 118 H566" stroke="#220111" stroke-width="3" marker-end="url(#ar)"/><text x="650" y="50" font-family="Space Mono, ui-monospace, monospace" font-size="11" font-weight="700" fill="#5E8700" text-anchor="middle">3</text><rect x="560.0" y="60" width="180" height="116" rx="14" fill="#fff" stroke="#5E8700" stroke-width="3"/><text x="650" y="100" font-size="30" text-anchor="middle">📤</text><text x="650" y="124" font-family="Jost, sans-serif" font-size="15.5" font-weight="700" fill="#220111" text-anchor="middle">OUTPUT</text><text x="650" y="144" font-family="Jost, sans-serif" font-size="12" font-weight="500" fill="#6E5F56" text-anchor="middle">what comes back</text><text x="650" y="160" font-family="Jost, sans-serif" font-size="12" font-weight="500" fill="#6E5F56" text-anchor="middle">(a reminder!)</text><path d="M650 182 V214 H150 V182" stroke="#7A3FB0" stroke-width="3" fill="none" marker-end="url(#ar)" stroke-linejoin="round"/><text x="400" y="208" font-family="Jost, sans-serif" font-size="12.5" font-weight="700" fill="#7A3FB0" text-anchor="middle">4 · FEEDBACK — when you tap 👍, that becomes new input the AI learns from</text><text x="400" y="252" font-family="Jost, sans-serif" font-size="13" font-weight="600" fill="#6E5F56" text-anchor="middle">A person always decides what goes in and what comes out — AI isn’t magic.</text>
</svg>
