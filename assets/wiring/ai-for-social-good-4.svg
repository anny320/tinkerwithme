<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" font-family="Jost, sans-serif">
<rect x="0" y="0" width="800" height="260" fill="#FBF7F2"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#220111"/></marker></defs>

<text x="30" y="34" font-family="Space Mono, ui-monospace, monospace" font-size="16" font-weight="700" fill="#220111">Present · Problem → Solution → Impact → Ask</text>
<text x="30" y="56" font-family="Jost, sans-serif" font-size="14" font-weight="500" fill="#6E5F56">Four parts tell your whole story in under 3 minutes.</text>

<rect x="30" y="84" width="175" height="96" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/>
<text x="195" y="116" text-anchor="end" font-size="26">❗</text>
<text x="48" y="122" font-size="16" font-weight="700" fill="#C23B3B">Problem</text>
<text x="48" y="146" font-size="11.5" font-weight="500" fill="#6E5F56">a real story +</text>
<text x="48" y="164" font-size="11.5" font-weight="500" fill="#6E5F56">verified evidence</text>

<rect x="217" y="84" width="175" height="96" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/>
<text x="382" y="116" text-anchor="end" font-size="26">💡</text>
<text x="235" y="122" font-size="16" font-weight="700" fill="#7A3FB0">Solution</text>
<text x="235" y="146" font-size="11.5" font-weight="500" fill="#6E5F56">demo your</text>
<text x="235" y="164" font-size="11.5" font-weight="500" fill="#6E5F56">prototype</text>

<rect x="404" y="84" width="175" height="96" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/>
<text x="569" y="116" text-anchor="end" font-size="26">📈</text>
<text x="422" y="122" font-size="16" font-weight="700" fill="#5E8700">Impact</text>
<text x="422" y="146" font-size="11.5" font-weight="500" fill="#6E5F56">who benefits &amp;</text>
<text x="422" y="164" font-size="11.5" font-weight="500" fill="#6E5F56">how you'd know</text>

<rect x="591" y="84" width="179" height="96" rx="14" fill="#fff" stroke="#5E8700" stroke-width="3"/>
<text x="751" y="116" text-anchor="end" font-size="26">🙌</text>
<text x="609" y="122" font-size="16" font-weight="700" fill="#004C97">Ask</text>
<text x="609" y="146" font-size="11.5" font-weight="500" fill="#6E5F56">what you need</text>
<text x="609" y="164" font-size="11.5" font-weight="500" fill="#6E5F56">next</text>

<path d="M205 132 H215" stroke="#220111" stroke-width="3" marker-end="url(#ar)"/>
<path d="M392 132 H402" stroke="#220111" stroke-width="3" marker-end="url(#ar)"/>
<path d="M579 132 H589" stroke="#220111" stroke-width="3" marker-end="url(#ar)"/>

<text x="400" y="222" text-anchor="middle" font-family="Jost, sans-serif" font-size="13" font-weight="600" fill="#220111">Lead with <tspan font-weight="700">impact</tspan>, not features. Keep slides light — rehearse out loud and time it.</text>
