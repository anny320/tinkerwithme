<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Jost, sans-serif">
<rect x="0" y="0" width="800" height="300" fill="#FBF7F2"/>

<text x="30" y="34" font-family="Space Mono, ui-monospace, monospace" font-size="16" font-weight="700" fill="#220111">Product &amp; Marketing · three tones, one product</text>
<text x="30" y="56" font-family="Jost, sans-serif" font-size="14" font-weight="500" fill="#6E5F56">Ask AI for the same caption in 3 tones — then pick one and make it sound like you.</text>

<rect x="30" y="84" width="240" height="140" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/>
