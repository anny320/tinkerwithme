<text x="50" y="164" font-size="12.5" font-weight="500" fill="#6E5F56">lunches — snack happy! 🎉"</text>
<text x="50" y="206" font-size="11" font-weight="600" fill="#9b8c84">#SnackTime #Nairobi</text>

<rect x="280" y="84" width="240" height="140" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/>
<text x="300" y="112" font-size="26">💼</text>
<text x="342" y="110" font-size="16" font-weight="700" fill="#004C97">Confident &amp; pro</text>
<text x="300" y="146" font-size="12.5" font-weight="500" fill="#6E5F56">"Fresh, healthy snacks</text>
