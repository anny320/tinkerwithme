<text x="550" y="206" font-size="11" font-weight="600" fill="#9b8c84">#MadeInKenya #Care</text>

<rect x="30" y="248" width="740" height="40" rx="12" fill="#F0F7DE" stroke="#5E8700" stroke-width="2.5"/>
