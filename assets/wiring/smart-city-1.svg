<text x="40" y="38" fill="#220111" font-size="17" font-weight="700">Smart City · Traffic system</text>
<text x="40" y="56" fill="#6E5F56" font-size="12" font-weight="700">Three LEDs (red/amber/green) + a walk buzzer, driven in a timed sequence.</text>
