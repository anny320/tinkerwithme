<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Jost, sans-serif">
<rect x="0" y="0" width="800" height="300" fill="#FBF7F2"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#220111"/></marker></defs>

<text x="30" y="34" font-family="Space Mono, ui-monospace, monospace" font-size="16" font-weight="700" fill="#220111">Day 2 · camera → AI → Web Serial → green time</text>
<text x="30" y="56" font-family="Jost, sans-serif" font-size="14" font-weight="500" fill="#6E5F56">The webcam sees traffic, the AI names it, and one letter tells the Arduino what to do.</text>

<rect x="30" y="82" width="150" height="56" rx="12" fill="#fff" stroke="#220111" stroke-width="2.5"/>
<text x="105" y="106" text-anchor="middle" font-size="22">📷</text><text x="105" y="128" text-anchor="middle" font-size="12.5" font-weight="700" fill="#004C97">camera sees</text>
<path d="M180 110 H214" stroke="#220111" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="228" y="82" width="170" height="56" rx="12" fill="#fff" stroke="#220111" stroke-width="2.5"/>
<text x="313" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#7A3FB0">🧠 Teachable Machine</text><text x="313" y="126" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6E5F56">classifies the traffic</text>
<path d="M398 110 H432" stroke="#220111" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="446" y="82" width="170" height="56" rx="12" fill="#fff" stroke="#220111" stroke-width="2.5"/>
<text x="531" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#E0641B">🔌 Web Serial</text><text x="531" y="126" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6E5F56">sends one letter</text>

<!-- mapping table -->
<g font-family="Jost, sans-serif">
<rect x="150" y="166" width="500" height="40" rx="8" fill="#5E8700"/>
<text x="230" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Low traffic</text>
<text x="400" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">sends "L"</text>
<text x="570" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">green = 3s</text>

<rect x="150" y="210" width="500" height="40" rx="8" fill="#E8B23A"/>
<text x="230" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#5c4300">Medium</text>
<text x="400" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#5c4300">sends "M"</text>
<text x="570" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#5c4300">green = 6s</text>

<rect x="150" y="254" width="500" height="40" rx="8" fill="#C23B3B"/>
<text x="230" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">High traffic</text>
<text x="400" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">sends "H"</text>
<text x="570" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">green = 9s</text>
</g>
<text x="690" y="235" font-family="Jost, sans-serif" font-size="12" font-weight="700" fill="#220111" text-anchor="middle">busier road</text>
<text x="690" y="251" font-family="Jost, sans-serif" font-size="12" font-weight="700" fill="#220111" text-anchor="middle">→ longer</text>
<text x="690" y="267" font-family="Jost, sans-serif" font-size="12" font-weight="700" fill="#220111" text-anchor="middle">green</text>
</svg>
