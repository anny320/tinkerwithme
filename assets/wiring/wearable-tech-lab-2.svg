<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Jost, sans-serif">
<rect x="0" y="0" width="800" height="300" fill="#FBF7F2"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#220111"/></marker></defs>

<text x="30" y="34" font-family="Space Mono, ui-monospace, monospace" font-size="16" font-weight="700" fill="#220111">React &amp; personalise · a button cycles light shows</text>
<text x="30" y="56" font-family="Jost, sans-serif" font-size="14" font-weight="500" fill="#6E5F56">One button steps through three modes:  mode = (mode + 1) % 3</text>

<rect x="30" y="86" width="230" height="96" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/>
<circle cx="56" cy="112" r="15" fill="#7A3FB0"/><text x="56" y="117" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">0</text>
<text x="240" y="122" text-anchor="end" font-size="28">🌈</text>
<text x="48" y="156" font-size="17" font-weight="700" fill="#220111">Rainbow</text>
<text x="48" y="174" font-size="12" font-weight="500" fill="#6E5F56">colours chase along</text>

<rect x="285" y="86" width="230" height="96" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/>
<circle cx="311" cy="112" r="15" fill="#7A3FB0"/><text x="311" y="117" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
<text x="495" y="122" text-anchor="end" font-size="28">💗</text>
<text x="303" y="156" font-size="17" font-weight="700" fill="#220111">Heartbeat</text>
<text x="303" y="174" font-size="12" font-weight="500" fill="#6E5F56">pulses in and out</text>

<rect x="540" y="86" width="230" height="96" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/>
<circle cx="566" cy="112" r="15" fill="#7A3FB0"/><text x="566" y="117" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
<text x="750" y="122" text-anchor="end" font-size="28">🔊</text>
<text x="558" y="156" font-size="17" font-weight="700" fill="#220111">Sound-reactive</text>
<text x="558" y="174" font-size="12" font-weight="500" fill="#6E5F56">louder → brighter</text>

<path d="M260 134 H281" stroke="#220111" stroke-width="3" marker-end="url(#ar)"/>
<path d="M515 134 H536" stroke="#220111" stroke-width="3" marker-end="url(#ar)"/>
<path d="M655 186 C655 214, 145 214, 145 188" stroke="#7A3FB0" stroke-width="2.5" fill="none" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<text x="400" y="230" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7A3FB0">press again → back to mode 0</text>

<text x="30" y="266" font-family="Jost, sans-serif" font-size="13" font-weight="600" fill="#220111">A tiny delay after a press <tspan font-weight="700">debounces</tspan> it (one tap = one change); the mic on A0 drives the sound mode.</text>
</svg>
