<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Space Mono, ui-monospace, monospace">
<rect x="0" y="0" width="800" height="420" fill="#FBF7F2"/>
<!-- rails -->
<path d="M700 70 V394" stroke="#3A3A3A" stroke-width="5" stroke-linecap="round"/>
<text x="693" y="62" text-anchor="end" fill="#6E5F56" font-size="12.5" font-weight="700">GND (−)</text>
<path d="M740 70 V394" stroke="#D8322B" stroke-width="5" stroke-linecap="round"/>
<text x="747" y="62" text-anchor="start" fill="#D8322B" font-size="12.5" font-weight="700">5V (+)</text>

<!-- Arduino -->
<rect x="40" y="90" width="150" height="250" rx="12" fill="#0E7C86" stroke="#09434A" stroke-width="4"/>
<rect x="20" y="110" width="24" height="40" rx="3" fill="#C3C7CB" stroke="#5a5f63" stroke-width="2"/>
<text x="115" y="320" text-anchor="middle" fill="#EAF7F5" font-size="14" font-weight="700">ARDUINO</text>
<text x="115" y="336" text-anchor="middle" fill="#EAF7F5" font-size="14" font-weight="700">UNO</text>

<!-- D11 -> TRIG -->
<rect x="186" y="134" width="22" height="15" rx="2" fill="#E8B23A" stroke="#7A5A12" stroke-width="2"/>
<text x="180" y="146" text-anchor="end" fill="#EAF7F5" font-size="12" font-weight="700">D11</text>
<path d="M208 141 L470 141" stroke="#2E7DE0" stroke-width="3.6" fill="none" stroke-linecap="round"/>
<text x="430" y="133" text-anchor="middle" fill="#6E5F56" font-size="11" font-weight="700">TRIG</text>
<!-- D12 -> ECHO -->
<rect x="186" y="186" width="22" height="15" rx="2" fill="#E8B23A" stroke="#7A5A12" stroke-width="2"/>
<text x="180" y="198" text-anchor="end" fill="#EAF7F5" font-size="12" font-weight="700">D12</text>
<path d="M208 193 L470 193" stroke="#2E7DE0" stroke-width="3.6" fill="none" stroke-linecap="round"/>
<text x="430" y="185" text-anchor="middle" fill="#6E5F56" font-size="11" font-weight="700">ECHO</text>

<!-- HC-SR04 module -->
<rect x="470" y="110" width="170" height="120" rx="10" fill="#1C6E8C" stroke="#0e3a49" stroke-width="4"/>
<text x="555" y="130" text-anchor="middle" fill="#D7EEF5" font-size="12.5" font-weight="700">HC-SR04</text>
<circle cx="518" cy="178" r="26" fill="#123b49" stroke="#0a2730" stroke-width="3"/>
<circle cx="592" cy="178" r="26" fill="#123b49" stroke="#0a2730" stroke-width="3"/>
<text x="518" y="182" text-anchor="middle" fill="#7fb4c4" font-size="10" font-weight="700">T</text>
<text x="592" y="182" text-anchor="middle" fill="#7fb4c4" font-size="10" font-weight="700">R</text>
<!-- pin dots -->
<circle cx="470" cy="141" r="4" fill="#2E7DE0"/>
<circle cx="470" cy="193" r="4" fill="#2E7DE0"/>

<!-- VCC -> 5V rail -->
<text x="648" y="130" text-anchor="start" fill="#6E5F56" font-size="11" font-weight="700">VCC</text>
<path d="M640 124 L680 124 L680 88 L740 88" stroke="#D8322B" stroke-width="3.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<!-- GND -> GND rail -->
<text x="648" y="216" text-anchor="start" fill="#6E5F56" font-size="11" font-weight="700">GND</text>
<path d="M640 210 L666 210 L666 92 L700 92" stroke="#3A3A3A" stroke-width="3.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>

<!-- Arduino 5V + GND -->
<rect x="186" y="270" width="22" height="15" rx="2" fill="#E24A3B" stroke="#7a2018" stroke-width="2"/>
<text x="180" y="282" text-anchor="end" fill="#EAF7F5" font-size="11" font-weight="700">5V</text>
<path d="M208 277 L240 277 L240 380 L740 380" stroke="#D8322B" stroke-width="3.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="186" y="296" width="22" height="15" rx="2" fill="#9AA0A6" stroke="#4a4f54" stroke-width="2"/>
<text x="180" y="308" text-anchor="end" fill="#EAF7F5" font-size="11" font-weight="700">GND</text>
<path d="M208 303 L224 303 L224 366 L700 366" stroke="#3A3A3A" stroke-width="3.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>

<!-- echo waves -->
<path d="M620 300 q20 -16 40 0" stroke="#1C6E8C" stroke-width="2.6" fill="none" opacity=".7"/>
<path d="M612 312 q28 -22 56 0" stroke="#1C6E8C" stroke-width="2.6" fill="none" opacity=".5"/>
<text x="640" y="334" text-anchor="middle" fill="#6E5F56" font-size="10.5" font-weight="700">sound → echo → distance</text>

<!-- title -->
<text x="40" y="40" fill="#220111" font-size="17" font-weight="700">Self-Driving Car · Session 3 — Dodge obstacles</text>
<text x="40" y="58" fill="#6E5F56" font-size="12" font-weight="700">The HC-SR04 times a sound echo (TRIG/ECHO). Time → distance.</text>
</svg>
