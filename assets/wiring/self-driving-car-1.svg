<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Space Mono, ui-monospace, monospace">
<rect x="0" y="0" width="800" height="470" fill="#FBF7F2"/>
<!-- GND rail -->
<path d="M712 60 V442" stroke="#3A3A3A" stroke-width="5" stroke-linecap="round"/>
<text x="705" y="52" text-anchor="end" fill="#6E5F56" font-size="12.5" font-weight="700">GND (−)</text>
<text x="712" y="458" text-anchor="middle" fill="#6E5F56" font-size="11" font-weight="700">common ground</text>

<!-- Arduino -->
<rect x="40" y="76" width="150" height="300" rx="12" fill="#0E7C86" stroke="#09434A" stroke-width="4"/>
<rect x="20" y="96" width="24" height="40" rx="3" fill="#C3C7CB" stroke="#5a5f63" stroke-width="2"/>
<text x="115" y="356" text-anchor="middle" fill="#EAF7F5" font-size="14" font-weight="700">ARDUINO</text>
<text x="115" y="372" text-anchor="middle" fill="#EAF7F5" font-size="14" font-weight="700">UNO</text>

<!-- L298N module -->
<rect x="360" y="86" width="180" height="252" rx="10" fill="#34506A" stroke="#1d2f40" stroke-width="4"/>
<text x="450" y="106" text-anchor="middle" fill="#CFE0EE" font-size="13" font-weight="700">L298N</text>
<text x="450" y="121" text-anchor="middle" fill="#9FBAD0" font-size="10.5" font-weight="700">MOTOR DRIVER</text>

<!-- control pins: Arduino pad -> L298N input -->
<!-- D5 / ENA -->
<rect x="186" y="134" width="22" height="15" rx="2" fill="#E8B23A" stroke="#7A5A12" stroke-width="2"/>
<text x="180" y="146" text-anchor="end" fill="#EAF7F5" font-size="12" font-weight="700">D5</text>
<path d="M208 141 H360" stroke="#2E7DE0" stroke-width="3.6" fill="none" stroke-linecap="round"/>
<text x="366" y="145" fill="#CFE0EE" font-size="11.5" font-weight="700">ENA</text>
<!-- D6 / IN1 -->
<rect x="186" y="168" width="22" height="15" rx="2" fill="#E8B23A" stroke="#7A5A12" stroke-width="2"/>
<text x="180" y="180" text-anchor="end" fill="#EAF7F5" font-size="12" font-weight="700">D6</text>
<path d="M208 175 H360" stroke="#2E7DE0" stroke-width="3.6" fill="none" stroke-linecap="round"/>
<text x="366" y="179" fill="#CFE0EE" font-size="11.5" font-weight="700">IN1</text>
<!-- D7 / IN2 -->
<rect x="186" y="202" width="22" height="15" rx="2" fill="#E8B23A" stroke="#7A5A12" stroke-width="2"/>
<text x="180" y="214" text-anchor="end" fill="#EAF7F5" font-size="12" font-weight="700">D7</text>
<path d="M208 209 H360" stroke="#2E7DE0" stroke-width="3.6" fill="none" stroke-linecap="round"/>
<text x="366" y="213" fill="#CFE0EE" font-size="11.5" font-weight="700">IN2</text>
<!-- D8 / IN3 -->
<rect x="186" y="236" width="22" height="15" rx="2" fill="#E8B23A" stroke="#7A5A12" stroke-width="2"/>
<text x="180" y="248" text-anchor="end" fill="#EAF7F5" font-size="12" font-weight="700">D8</text>
<path d="M208 243 H360" stroke="#2E7DE0" stroke-width="3.6" fill="none" stroke-linecap="round"/>
<text x="366" y="247" fill="#CFE0EE" font-size="11.5" font-weight="700">IN3</text>
<!-- D9 / IN4 -->
<rect x="186" y="270" width="22" height="15" rx="2" fill="#E8B23A" stroke="#7A5A12" stroke-width="2"/>
<text x="180" y="282" text-anchor="end" fill="#EAF7F5" font-size="12" font-weight="700">D9</text>
<path d="M208 277 H360" stroke="#2E7DE0" stroke-width="3.6" fill="none" stroke-linecap="round"/>
<text x="366" y="281" fill="#CFE0EE" font-size="11.5" font-weight="700">IN4</text>
<!-- D10 / ENB -->
<rect x="186" y="304" width="22" height="15" rx="2" fill="#E8B23A" stroke="#7A5A12" stroke-width="2"/>
<text x="180" y="316" text-anchor="end" fill="#EAF7F5" font-size="12" font-weight="700">D10</text>
<path d="M208 311 H360" stroke="#2E7DE0" stroke-width="3.6" fill="none" stroke-linecap="round"/>
<text x="366" y="315" fill="#CFE0EE" font-size="11.5" font-weight="700">ENB</text>

<!-- Arduino GND -> rail -->
<rect x="186" y="340" width="22" height="15" rx="2" fill="#9AA0A6" stroke="#4a4f54" stroke-width="2"/>
<text x="180" y="352" text-anchor="end" fill="#EAF7F5" font-size="11" font-weight="700">GND</text>
<path d="M208 347 L250 347 L250 424 L712 424" stroke="#3A3A3A" stroke-width="3.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>

<!-- Motors -->
<circle cx="648" cy="150" r="26" fill="#C3C7CB" stroke="#4a4f54" stroke-width="3.5"/>
<text x="648" y="155" text-anchor="middle" fill="#2b2b2b" font-size="16" font-weight="700">M</text>
<text x="648" y="112" text-anchor="middle" fill="#6E5F56" font-size="11.5" font-weight="700">MOTOR A (left)</text>
<circle cx="648" cy="268" r="26" fill="#C3C7CB" stroke="#4a4f54" stroke-width="3.5"/>
<text x="648" y="273" text-anchor="middle" fill="#2b2b2b" font-size="16" font-weight="700">M</text>
<text x="648" y="312" text-anchor="middle" fill="#6E5F56" font-size="11.5" font-weight="700">MOTOR B (right)</text>

<!-- OUT1/2 -> Motor A -->
<text x="534" y="135" text-anchor="end" fill="#CFE0EE" font-size="11" font-weight="700">OUT1</text>
<path d="M540 131 L600 131 L622 143" stroke="#B5532A" stroke-width="3.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="534" y="179" text-anchor="end" fill="#CFE0EE" font-size="11" font-weight="700">OUT2</text>
<path d="M540 175 L600 175 L622 160" stroke="#B5532A" stroke-width="3.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<!-- OUT3/4 -> Motor B -->
<text x="534" y="251" text-anchor="end" fill="#CFE0EE" font-size="11" font-weight="700">OUT3</text>
<path d="M540 247 L600 247 L622 260" stroke="#B5532A" stroke-width="3.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="534" y="295" text-anchor="end" fill="#CFE0EE" font-size="11" font-weight="700">OUT4</text>
<path d="M540 291 L600 291 L622 278" stroke="#B5532A" stroke-width="3.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>

<!-- Battery -->
<rect x="360" y="388" width="140" height="40" rx="6" fill="#2E7D32" stroke="#17421a" stroke-width="3.5"/>
<text x="430" y="413" text-anchor="middle" fill="#EAF7F5" font-size="12.5" font-weight="700">BATTERY 6–9V</text>
<!-- + to L298N +12V -->
<text x="392" y="352" text-anchor="middle" fill="#6E5F56" font-size="11" font-weight="700">+12V</text>
<path d="M392 338 V388" stroke="#D8322B" stroke-width="3.8" fill="none" stroke-linecap="round"/>
<circle cx="392" cy="388" r="3.2" fill="#D8322B"/>
<!-- - to GND rail -->
<text x="470" y="352" text-anchor="middle" fill="#6E5F56" font-size="11" font-weight="700">GND</text>
<path d="M470 338 V360 L470 360" stroke="#3A3A3A" stroke-width="3.4" fill="none" stroke-linecap="round"/>
<path d="M478 428 L478 436 L712 436" stroke="#3A3A3A" stroke-width="3.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M470 338 V428 H478" stroke="#3A3A3A" stroke-width="3.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>

<!-- title -->
<text x="40" y="36" fill="#220111" font-size="17" font-weight="700">Self-Driving Car · Session 1 — Make it move</text>
<text x="40" y="54" fill="#6E5F56" font-size="12" font-weight="700">Arduino → L298N driver → 2 DC motors. The battery powers the motors.</text>
</svg>
