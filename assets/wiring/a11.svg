<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#220111"/></marker></defs>
<text x="28" y="38" font-family="Space Mono, ui-monospace, monospace" font-size="12" font-weight="700" fill="#5E8700" text-anchor="start">FAIR DATA — everyone got a say</text><rect x="28" y="50" width="200" height="58" rx="12" fill="#F0F7DE" stroke="#5E8700" stroke-width="2.5"/><text x="128" y="74" font-family="Jost, sans-serif" font-size="13.5" font-weight="700" fill="#220111" text-anchor="middle">🙋 asked EVERYONE</text><text x="128" y="94" font-family="Jost, sans-serif" font-size="12" font-weight="500" fill="#6E5F56" text-anchor="middle">whole class surveyed</text><path d="M232 79 H300" stroke="#220111" stroke-width="3" marker-end="url(#ar)"/><g transform="translate(318 52) scale(1.0)"><rect x="0" y="6" width="64" height="48" rx="12" fill="#B9C2C7" stroke="#220111" stroke-width="2.5"/><circle cx="8" cy="-2" r="4" fill="#FFD23F" stroke="#220111" stroke-width="2"/><path d="M8 2 V6" stroke="#220111" stroke-width="2.5"/><circle cx="22" cy="28" r="7" fill="#fff" stroke="#220111" stroke-width="2.5"/><circle cx="44" cy="28" r="7" fill="#fff" stroke="#220111" stroke-width="2.5"/><circle cx="22" cy="28" r="2.5" fill="#220111"/><circle cx="44" cy="28" r="2.5" fill="#220111"/><path d="M23 42 q9 7 18 0" stroke="#220111" stroke-width="2.5" fill="none" stroke-linecap="round"/></g><path d="M392 79 H460" stroke="#220111" stroke-width="3" marker-end="url(#ar)"/><rect x="474" y="50" width="298" height="58" rx="12" fill="#F0F7DE" stroke="#5E8700" stroke-width="2.5"/><text x="623" y="74" font-family="Jost, sans-serif" font-size="14" font-weight="700" fill="#5E8700" text-anchor="middle">✅ fair, correct answer</text><text x="623" y="94" font-family="Jost, sans-serif" font-size="12" font-weight="500" fill="#6E5F56" text-anchor="middle">represents everyone</text><text x="28" y="152" font-family="Space Mono, ui-monospace, monospace" font-size="12" font-weight="700" fill="#C23B3B" text-anchor="start">BROKEN DATA — only the front rows</text><rect x="28" y="164" width="200" height="58" rx="12" fill="#FBE7E7" stroke="#C23B3B" stroke-width="2.5"/><text x="128" y="188" font-family="Jost, sans-serif" font-size="13.5" font-weight="700" fill="#220111" text-anchor="middle">✌️ asked only 2 rows</text><text x="128" y="208" font-family="Jost, sans-serif" font-size="12" font-weight="500" fill="#6E5F56" text-anchor="middle">most kids skipped</text><path d="M232 193 H300" stroke="#220111" stroke-width="3" marker-end="url(#ar)"/><g transform="translate(318 166) scale(1.0)"><rect x="0" y="6" width="64" height="48" rx="12" fill="#B9C2C7" stroke="#220111" stroke-width="2.5"/><circle cx="8" cy="-2" r="4" fill="#FFD23F" stroke="#220111" stroke-width="2"/><path d="M8 2 V6" stroke="#220111" stroke-width="2.5"/><circle cx="22" cy="28" r="7" fill="#fff" stroke="#220111" stroke-width="2.5"/><circle cx="44" cy="28" r="7" fill="#fff" stroke="#220111" stroke-width="2.5"/><circle cx="22" cy="28" r="2.5" fill="#220111"/><circle cx="44" cy="28" r="2.5" fill="#220111"/><path d="M24 44 h16" stroke="#220111" stroke-width="2.5" stroke-linecap="round"/></g><path d="M392 193 H460" stroke="#220111" stroke-width="3" marker-end="url(#ar)"/><rect x="474" y="164" width="298" height="58" rx="12" fill="#FBE7E7" stroke="#C23B3B" stroke-width="2.5"/><text x="623" y="188" font-family="Jost, sans-serif" font-size="14" font-weight="700" fill="#C23B3B" text-anchor="middle">❌ wrong, unfair answer</text><text x="623" y="208" font-family="Jost, sans-serif" font-size="12" font-weight="500" fill="#6E5F56" text-anchor="middle">left people out</text><text x="400" y="256" font-family="Jost, sans-serif" font-size="13" font-weight="600" fill="#6b5410" text-anchor="middle">Bad data in → bad answers out. Always ask: who is missing?</text>
</svg>
