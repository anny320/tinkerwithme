<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Jost, sans-serif">
<rect x="0" y="0" width="800" height="300" fill="#FBF7F2"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#220111"/></marker></defs>

<text x="40" y="34" font-family="Space Mono, ui-monospace, monospace" font-size="16" font-weight="700" fill="#220111">🎬 AI Movie Studio · the production line</text>
<text x="40" y="56" font-family="Jost, sans-serif" font-size="14" font-weight="500" fill="#6E5F56">Direct AI like a real film crew — write, illustrate, score, then premiere your short film.</text>

<!-- 1 Script -->
<rect x="30" y="90" width="165" height="120" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/>
<circle cx="54" cy="116" r="15" fill="#E0641B"/><text x="54" y="121" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text>
<text x="175" y="128" text-anchor="end" font-size="30">📝</text>
<text x="46" y="166" font-size="17" font-weight="700" fill="#220111">Script</text>
<text x="46" y="186" font-size="12" font-weight="500" fill="#6E5F56">ChatGPT — story</text>
<text x="46" y="202" font-size="12" font-weight="500" fill="#6E5F56">&amp; shot list</text>

<!-- 2 Visuals -->
<rect x="222" y="90" width="165" height="120" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/>
<circle cx="246" cy="116" r="15" fill="#7A3FB0"/><text x="246" y="121" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text>
<text x="367" y="128" text-anchor="end" font-size="30">🖼️</text>
<text x="238" y="166" font-size="17" font-weight="700" fill="#220111">Visuals</text>
<text x="238" y="186" font-size="12" font-weight="500" fill="#6E5F56">AI images —</text>
<text x="238" y="202" font-size="12" font-weight="500" fill="#6E5F56">one storyboard</text>

<!-- 3 Audio -->
<rect x="414" y="90" width="165" height="120" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/>
<circle cx="438" cy="116" r="15" fill="#5E8700"/><text x="438" y="121" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text>
<text x="559" y="128" text-anchor="end" font-size="30">🎵</text>
<text x="430" y="166" font-size="17" font-weight="700" fill="#220111">Audio</text>
<text x="430" y="186" font-size="12" font-weight="500" fill="#6E5F56">AI music +</text>
<text x="430" y="202" font-size="12" font-weight="500" fill="#6E5F56">sound effects</text>

<!-- 4 Edit & premiere -->
<rect x="606" y="90" width="165" height="120" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/>
<circle cx="630" cy="116" r="15" fill="#004C97"/><text x="630" y="121" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text>
<text x="751" y="128" text-anchor="end" font-size="30">🎬</text>
<text x="622" y="166" font-size="17" font-weight="700" fill="#220111">Edit &amp; premiere</text>
<text x="622" y="186" font-size="12" font-weight="500" fill="#6E5F56">CapCut — cut,</text>
<text x="622" y="202" font-size="12" font-weight="500" fill="#6E5F56">caption, export</text>

<path d="M195 150 H218" stroke="#220111" stroke-width="3" marker-end="url(#ar)"/>
<path d="M387 150 H410" stroke="#220111" stroke-width="3" marker-end="url(#ar)"/>
<path d="M579 150 H602" stroke="#220111" stroke-width="3" marker-end="url(#ar)"/>

<text x="40" y="256" font-family="Jost, sans-serif" font-size="13" font-weight="600" fill="#220111">Every stage feeds the next — you never touch a camera; you direct the crew.</text>
<text x="40" y="278" font-family="Jost, sans-serif" font-size="13" font-weight="500" fill="#6E5F56">Finished short film (MP4) + the full asset folder behind it.</text>
</svg>
