<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 252" font-family="Jost, sans-serif">
<rect x="0" y="0" width="800" height="252" fill="#FBF7F2"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#220111"/></marker></defs>
<text x="28" y="38" font-family="Space Mono, ui-monospace, monospace" font-size="12" font-weight="700" fill="#C23B3B" text-anchor="start">UNFAIR TRAINING DATA</text><rect x="28" y="56" width="120" height="26" rx="6" fill="#E0641B"/><text x="158" y="75" font-family="Jost, sans-serif" font-size="12" font-weight="600" fill="#6E5F56" text-anchor="start">Group A</text><rect x="28" y="96" width="30" height="26" rx="6" fill="#004C97"/><text x="68" y="115" font-family="Jost, sans-serif" font-size="12" font-weight="600" fill="#6E5F56" text-anchor="start">Group B</text><rect x="28" y="136" width="14" height="26" rx="6" fill="#5E8700"/><text x="52" y="155" font-family="Jost, sans-serif" font-size="12" font-weight="600" fill="#6E5F56" text-anchor="start">Group C</text><text x="100" y="196" font-family="Jost, sans-serif" font-size="12" font-weight="500" fill="#6E5F56" text-anchor="middle">some groups over-shown,</text><text x="100" y="212" font-family="Jost, sans-serif" font-size="12" font-weight="500" fill="#6E5F56" text-anchor="middle">others barely there</text><path d="M200 120 H286" stroke="#220111" stroke-width="3" marker-end="url(#ar)"/><text x="366" y="52" font-family="Space Mono, ui-monospace, monospace" font-size="11" font-weight="700" fill="#220111" text-anchor="middle">THE AI</text><rect x="301.0" y="62" width="130" height="116" rx="14" fill="#fff" stroke="#220111" stroke-width="3"/><text x="366" y="102" font-size="30" text-anchor="middle">🤖</text><text x="366" y="126" font-family="Jost, sans-serif" font-size="15.5" font-weight="700" fill="#220111" text-anchor="middle">AI learns</text><text x="366" y="146" font-family="Jost, sans-serif" font-size="12" font-weight="500" fill="#6E5F56" text-anchor="middle">from what it</text><text x="366" y="162" font-family="Jost, sans-serif" font-size="12" font-weight="500" fill="#6E5F56" text-anchor="middle">was shown</text><path d="M434 120 H520" stroke="#220111" stroke-width="3" marker-end="url(#ar)"/><rect x="540" y="78" width="232" height="84" rx="12" fill="#FBE7E7" stroke="#C23B3B" stroke-width="2.5"/><text x="656" y="104" font-family="Jost, sans-serif" font-size="15" font-weight="700" fill="#C23B3B" text-anchor="middle">⚠️ Unfair result</text><text x="656" y="126" font-family="Jost, sans-serif" font-size="12" font-weight="500" fill="#6E5F56" text-anchor="middle">e.g. “doctor” images</text><text x="656" y="142" font-family="Jost, sans-serif" font-size="12" font-weight="500" fill="#6E5F56" text-anchor="middle">all look the same</text><text x="400" y="232" font-family="Jost, sans-serif" font-size="12.5" font-weight="600" fill="#6b5410" text-anchor="middle">Bias in the data → bias in the answer. Use AI wisely: what it shows isn’t always true.</text>
</svg>
