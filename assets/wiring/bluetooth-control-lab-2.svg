<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Jost, sans-serif">
<rect x="0" y="0" width="800" height="300" fill="#FBF7F2"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#220111"/></marker></defs>

<text x="30" y="34" font-family="Space Mono, ui-monospace, monospace" font-size="16" font-weight="700" fill="#220111">Two-way · commands out, sensor data back</text>
<text x="30" y="56" font-family="Jost, sans-serif" font-size="14" font-weight="500" fill="#6E5F56">A real remote talks both ways over one Bluetooth link.</text>

<!-- phone -->
<rect x="40" y="96" width="150" height="150" rx="18" fill="#fff" stroke="#220111" stroke-width="2.5"/>
<rect x="54" y="112" width="122" height="104" rx="6" fill="#EAF2FF" stroke="#2B4C9B" stroke-width="2"/>
<circle cx="115" cy="232" r="7" fill="#fff" stroke="#220111" stroke-width="2"/>
<text x="115" y="88" text-anchor="middle" font-size="26">📱</text>
<text x="115" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#2B4C9B">Your app</text>

<!-- arduino -->
<rect x="610" y="96" width="150" height="150" rx="14" fill="#0E7C86" stroke="#09434A" stroke-width="3"/>
<text x="685" y="88" text-anchor="middle" font-size="26">🤖</text>
<text x="685" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#EAF7F5">Arduino</text>
<text x="685" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#bfe6e2">gadget</text>
<text x="685" y="196" text-anchor="middle" font-size="10.5" font-weight="700" fill="#bfe6e2">+ HC-SR04</text>

<!-- arrows -->
<path d="M196 142 H604" stroke="#E0641B" stroke-width="3.5" fill="none" marker-end="url(#ar)"/>
<rect x="300" y="120" width="200" height="26" rx="8" fill="#FBF7F2"/>
<text x="400" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#E0641B">commands → 1  0  F  S</text>

<path d="M604 200 H196" stroke="#5E8700" stroke-width="3.5" fill="none" marker-end="url(#ar)"/>
<rect x="290" y="186" width="220" height="26" rx="8" fill="#FBF7F2"/>
<text x="400" y="204" text-anchor="middle" font-size="13" font-weight="700" fill="#5E8700">← DIST: 20   (every 500ms)</text>

<rect x="30" y="256" width="741" height="34" rx="10" fill="#F0F7DE" stroke="#5E8700" stroke-width="2"/>
<text x="400" y="278" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3f5c00">Tagging data with "DIST:" lets the app pick the distance out of everything on the line.</text>
</svg>
