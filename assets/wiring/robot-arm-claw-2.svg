<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Jost, sans-serif">
<rect x="0" y="0" width="800" height="300" fill="#FBF7F2"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#220111"/></marker></defs>

<text x="30" y="34" font-family="Space Mono, ui-monospace, monospace" font-size="16" font-weight="700" fill="#220111">Program it · joystick → map() → servo</text>
<text x="30" y="56" font-family="Jost, sans-serif" font-size="14" font-weight="500" fill="#6E5F56">A joystick speaks in big numbers; a servo speaks in angles. map() is the translator.</text>

<rect x="30" y="86" width="215" height="96" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/>
<text x="225" y="122" text-anchor="end" font-size="30">🕹️</text>
<text x="46" y="126" font-size="17" font-weight="700" fill="#004C97">Joystick</text>
<text x="46" y="150" font-size="12.5" font-weight="500" fill="#6E5F56">reads 0 – 1023</text>
<text x="46" y="168" font-size="12.5" font-weight="500" fill="#9b8c84">(analogRead)</text>

<rect x="293" y="86" width="215" height="96" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/>
<text x="488" y="122" text-anchor="end" font-size="30">🔄</text>
<text x="309" y="126" font-size="17" font-weight="700" fill="#5E8700">map()</text>
<text x="309" y="150" font-size="12.5" font-weight="500" fill="#6E5F56">0–1023 → 20–160°</text>
<text x="309" y="168" font-size="12.5" font-weight="500" fill="#9b8c84">one line of code</text>

<rect x="556" y="86" width="215" height="96" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/>
<text x="751" y="122" text-anchor="end" font-size="30">⚙️</text>
<text x="572" y="126" font-size="17" font-weight="700" fill="#E0641B">Servo</text>
<text x="572" y="150" font-size="12.5" font-weight="500" fill="#6E5F56">moves to that angle</text>
<text x="572" y="168" font-size="12.5" font-weight="500" fill="#9b8c84">servo.write(angle)</text>

<path d="M245 134 H289" stroke="#220111" stroke-width="3" marker-end="url(#ar)"/>
<path d="M508 134 H552" stroke="#220111" stroke-width="3" marker-end="url(#ar)"/>

<rect x="30" y="202" width="741" height="40" rx="12" fill="#F0F7DE" stroke="#5E8700" stroke-width="2.5"/>
<text x="400" y="227" text-anchor="middle" font-size="13" font-weight="700" fill="#3f5c00">constrain() keeps each joint in a SAFE range so the arm never crashes into itself.</text>
<text x="30" y="272" font-family="Jost, sans-serif" font-size="13" font-weight="600" fill="#220111">🦀 The claw is just a 4th servo at two angles — a button press closes it (grab!) and releases it.</text>
</svg>
