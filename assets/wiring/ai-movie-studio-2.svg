<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Jost, sans-serif">
<rect x="0" y="0" width="800" height="300" fill="#FBF7F2"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#220111"/></marker></defs>

<text x="30" y="34" font-family="Space Mono, ui-monospace, monospace" font-size="16" font-weight="700" fill="#220111">Write &amp; visualise · three-act structure</text>
<text x="30" y="56" font-family="Jost, sans-serif" font-size="14" font-weight="500" fill="#6E5F56">Every good film has a beginning, a middle and an end — that's all a 2-minute movie needs.</text>

<rect x="30" y="86" width="225" height="96" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/>
<text x="46" y="114" font-family="Space Mono, ui-monospace, monospace" font-size="12" font-weight="700" fill="#E0641B">ACT 1</text>
<text x="46" y="142" font-size="17" font-weight="700" fill="#220111">Setup</text>
<text x="46" y="166" font-size="12.5" font-weight="500" fill="#6E5F56">meet the character</text>

<rect x="287" y="86" width="225" height="96" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/>
<text x="303" y="114" font-family="Space Mono, ui-monospace, monospace" font-size="12" font-weight="700" fill="#004C97">ACT 2</text>
<text x="303" y="142" font-size="17" font-weight="700" fill="#220111">Problem</text>
<text x="303" y="166" font-size="12.5" font-weight="500" fill="#6E5F56">something goes wrong</text>

<rect x="544" y="86" width="226" height="96" rx="14" fill="#fff" stroke="#220111" stroke-width="2.5"/>
<text x="560" y="114" font-family="Space Mono, ui-monospace, monospace" font-size="12" font-weight="700" fill="#5E8700">ACT 3</text>
<text x="560" y="142" font-size="17" font-weight="700" fill="#220111">Resolution</text>
<text x="560" y="166" font-size="12.5" font-weight="500" fill="#6E5F56">how it is solved</text>

<path d="M255 134 H283" stroke="#220111" stroke-width="3" marker-end="url(#ar)"/>
<path d="M512 134 H540" stroke="#220111" stroke-width="3" marker-end="url(#ar)"/>

<rect x="30" y="202" width="740" height="40" rx="12" fill="#F0F7DE" stroke="#5E8700" stroke-width="2.5"/>
<text x="400" y="227" text-anchor="middle" font-size="13" font-weight="700" fill="#3f5c00">Pitch: [Character] wants [goal], but [obstacle] gets in the way, until [resolution].</text>
<text x="30" y="272" font-family="Jost, sans-serif" font-size="12.5" font-weight="600" fill="#220111">🖼️ For a consistent look, paste the <tspan font-weight="700">exact same character description</tspan> into every scene's image prompt.</text>
</svg>
