<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Space Mono, ui-monospace, monospace">
<rect x="0" y="0" width="800" height="440" fill="#FBF7F2"/>
<path d="M700 70 V414" stroke="#3A3A3A" stroke-width="5" stroke-linecap="round"/>
<text x="693" y="62" text-anchor="end" fill="#6E5F56" font-size="12.5" font-weight="700">GND (−)</text>
<path d="M740 70 V200" stroke="#D8322B" stroke-width="5" stroke-linecap="round"/>
<text x="747" y="62" text-anchor="start" fill="#D8322B" font-size="12.5" font-weight="700">5V (+)</text>

<rect x="40" y="90" width="150" height="300" rx="12" fill="#0E7C86" stroke="#09434A" stroke-width="4"/>
<rect x="20" y="110" width="24" height="40" rx="3" fill="#C3C7CB" stroke="#5a5f63" stroke-width="2"/>
<text x="115" y="370" text-anchor="middle" fill="#EAF7F5" font-size="14" font-weight="700">ARDUINO UNO</text>

<!-- A0 LDR voltage divider -->
<rect x="186" y="120" width="22" height="15" rx="2" fill="#E8B23A" stroke="#7A5A12" stroke-width="2"/><text x="180" y="132" text-anchor="end" fill="#EAF7F5" font-size="12" font-weight="700">A0</text>
<path d="M208 127 L300 127" stroke="#2E7DE0" stroke-width="3.4" fill="none" stroke-linecap="round"/>
<circle cx="330" cy="127" r="3.5" fill="#220111"/>
<path d="M300 127 H360" stroke="#220111" stroke-width="2.6"/>
<circle cx="392" cy="127" r="16" fill="#d8c37a" stroke="#6b5a1e" stroke-width="3"/><path d="M384 121 l16 12 M384 133 l16 -12" stroke="#6b5a1e" stroke-width="1.6"/>
<text x="392" y="100" text-anchor="middle" fill="#6E5F56" font-size="10" font-weight="700">LDR</text>
<path d="M408 127 L480 127 L480 94 L740 94" stroke="#D8322B" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M330 130 L330 150 L341 161 L327 172 L341 183 L327 194 L334 205" stroke="#220111" stroke-width="2.6" fill="none" stroke-linejoin="round"/>
<text x="350" y="185" fill="#6E5F56" font-size="10" font-weight="700">10kΩ</text>
<path d="M334 205 L334 220 L700 220" stroke="#3A3A3A" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="300" y="240" fill="#6E5F56" font-size="10" font-weight="700">darker → lower number → lamps ON</text>

<!-- 4 lamp LEDs D2-D5 -->
<g>
<rect x="186" y="262" width="22" height="13" rx="2" fill="#E8B23A" stroke="#7A5A12" stroke-width="2"/><text x="180" y="273" text-anchor="end" fill="#EAF7F5" font-size="10" font-weight="700">D2</text>
<rect x="186" y="294" width="22" height="13" rx="2" fill="#E8B23A" stroke="#7A5A12" stroke-width="2"/><text x="180" y="305" text-anchor="end" fill="#EAF7F5" font-size="10" font-weight="700">D3</text>
<rect x="186" y="326" width="22" height="13" rx="2" fill="#E8B23A" stroke="#7A5A12" stroke-width="2"/><text x="180" y="337" text-anchor="end" fill="#EAF7F5" font-size="10" font-weight="700">D4</text>
<rect x="186" y="358" width="22" height="13" rx="2" fill="#E8B23A" stroke="#7A5A12" stroke-width="2"/><text x="180" y="369" text-anchor="end" fill="#EAF7F5" font-size="10" font-weight="700">D5</text>
</g>
<g>
<path d="M208 268 H250 M208 300 H250 M208 332 H250 M208 364 H250" stroke="#2E7DE0" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M250 268 l9 6 l9 -12 l9 12 l9 -6 M250 300 l9 6 l9 -12 l9 12 l9 -6 M250 332 l9 6 l9 -12 l9 12 l9 -6 M250 364 l9 6 l9 -12 l9 12 l9 -6" stroke="#220111" stroke-width="2.4" fill="none" stroke-linejoin="round"/>
<circle cx="315" cy="268" r="11" fill="#F4D03F" stroke="#220111" stroke-width="2.4"/>
<circle cx="315" cy="300" r="11" fill="#F4D03F" stroke="#220111" stroke-width="2.4"/>
<circle cx="315" cy="332" r="11" fill="#F4D03F" stroke="#220111" stroke-width="2.4"/>
<circle cx="315" cy="364" r="11" fill="#F4D03F" stroke="#220111" stroke-width="2.4"/>
</g>
<text x="338" y="320" fill="#220111" font-size="12" font-weight="700">4 street lamps</text>
<text x="338" y="336" fill="#6E5F56" font-size="9.5" font-weight="700">each via 220Ω → GND</text>
<path d="M326 268 L470 268 L470 390 L700 390 M326 300 L450 300 L450 390 M326 332 L430 332 L430 390 M326 364 L410 364 L410 390" stroke="#3A3A3A" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>

<text x="40" y="38" fill="#220111" font-size="17" font-weight="700">Street lights · switch on at dusk</text>
<text x="40" y="56" fill="#6E5F56" font-size="12" font-weight="700">An LDR + 10kΩ divider on A0 senses darkness; 4 lamp LEDs on D2–D5 light up.</text>
</svg>
