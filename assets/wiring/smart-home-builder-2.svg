<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Space Mono, ui-monospace, monospace">
<rect x="0" y="0" width="800" height="420" fill="#FBF7F2"/>
<path d="M700 70 V394" stroke="#3A3A3A" stroke-width="5" stroke-linecap="round"/>
<text x="693" y="62" text-anchor="end" fill="#6E5F56" font-size="12.5" font-weight="700">GND (−)</text>
<path d="M636 86 V290" stroke="#D8322B" stroke-width="5" stroke-linecap="round"/>
<text x="636" y="78" text-anchor="middle" fill="#D8322B" font-size="11.5" font-weight="700">fan +6V</text>

<rect x="40" y="90" width="150" height="270" rx="12" fill="#0E7C86" stroke="#09434A" stroke-width="4"/>
<rect x="20" y="110" width="24" height="40" rx="3" fill="#C3C7CB" stroke="#5a5f63" stroke-width="2"/>
<text x="115" y="340" text-anchor="middle" fill="#EAF7F5" font-size="14" font-weight="700">ARDUINO UNO</text>

<!-- A1 TMP36 -->
<rect x="186" y="128" width="22" height="15" rx="2" fill="#E8B23A" stroke="#7A5A12" stroke-width="2"/><text x="180" y="140" text-anchor="end" fill="#EAF7F5" font-size="12" font-weight="700">A1</text>
<path d="M208 135 H430" stroke="#2E7DE0" stroke-width="3.4" fill="none" stroke-linecap="round"/>
<rect x="430" y="110" width="150" height="48" rx="7" fill="#444" stroke="#111" stroke-width="3"/>
<text x="505" y="130" text-anchor="middle" fill="#eee" font-size="11.5" font-weight="700">TMP36 SENSOR</text>
<text x="505" y="146" text-anchor="middle" fill="#bbb" font-size="10" font-weight="700">temperature → °C</text>
<path d="M580 120 L610 120 L610 94 L700 94" stroke="#3A3A3A" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M580 148 L600 148 L600 98 L700 98" stroke="#3A3A3A" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>

<!-- D4 relay -> fan -->
<rect x="186" y="200" width="22" height="15" rx="2" fill="#E8B23A" stroke="#7A5A12" stroke-width="2"/><text x="180" y="212" text-anchor="end" fill="#EAF7F5" font-size="12" font-weight="700">D4</text>
<path d="M208 207 H430" stroke="#2E7DE0" stroke-width="3.4" fill="none" stroke-linecap="round"/>
<rect x="430" y="188" width="130" height="46" rx="7" fill="#7A3B2E" stroke="#431d16" stroke-width="3"/>
<text x="495" y="208" text-anchor="middle" fill="#f3ded7" font-size="11.5" font-weight="700">RELAY</text>
<text x="495" y="223" text-anchor="middle" fill="#d6b3a8" font-size="10" font-weight="700">switches the fan</text>
<circle cx="610" cy="211" r="22" fill="#355E8C" stroke="#1d3450" stroke-width="3"/>
<text x="610" y="216" text-anchor="middle" fill="#dbe8f5" font-size="13" font-weight="700">F</text>
<text x="610" y="250" text-anchor="middle" fill="#6E5F56" font-size="10.5" font-weight="700">fan (hot → ON)</text>
<path d="M560 202 H588" stroke="#220111" stroke-width="3" stroke-linecap="round"/>
<path d="M610 189 V140 H636 V290 M610 189" stroke="#D8322B" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>

<!-- battery -->
<rect x="430" y="300" width="150" height="40" rx="6" fill="#2E7D32" stroke="#17421a" stroke-width="3.5"/>
<text x="505" y="325" text-anchor="middle" fill="#EAF7F5" font-size="12" font-weight="700">4×AA fan power</text>
<path d="M460 300 V288 H636 V290" stroke="#D8322B" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M550 340 V356 H700 V356" stroke="#3A3A3A" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>

<text x="40" y="38" fill="#220111" font-size="17" font-weight="700">Climate control · temperature → fan</text>
<text x="40" y="56" fill="#6E5F56" font-size="12" font-weight="700">A TMP36 reads °C on A1; above 28°C the relay (D4) runs the fan on its own battery.</text>
</svg>
