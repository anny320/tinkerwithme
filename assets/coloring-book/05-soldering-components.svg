<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <text x="200" y="30" font-size="20" font-weight="bold" text-anchor="middle" font-family="sans-serif">Soldering & Building</text>

  <!-- Circuit board being soldered -->
  <rect x="80" y="120" width="240" height="180" rx="8" fill="none" stroke="black" stroke-width="2"/>
  <rect x="85" y="125" width="230" height="170" fill="none" stroke="black" stroke-width="1"/>

  <!-- Copper traces pattern -->
  <path d="M 100 140 L 150 140 L 150 160 L 200 160" fill="none" stroke="black" stroke-width="1.5"/>
  <path d="M 120 180 L 180 180 L 180 220" fill="none" stroke="black" stroke-width="1.5"/>
  <path d="M 250 150 L 280 150 L 280 200" fill="none" stroke="black" stroke-width="1.5"/>

  <!-- Solder pads (circles) -->
  <circle cx="100" cy="140" r="4" fill="black"/>
  <circle cx="150" cy="140" r="4" fill="black"/>
  <circle cx="150" cy="160" r="4" fill="black"/>
  <circle cx="200" cy="160" r="4" fill="black"/>
  <circle cx="120" cy="180" r="4" fill="black"/>
  <circle cx="180" cy="180" r="4" fill="black"/>
  <circle cx="180" cy="220" r="4" fill="black"/>
  <circle cx="250" cy="150" r="4" fill="black"/>
  <circle cx="280" cy="150" r="4" fill="black"/>
  <circle cx="280" cy="200" r="4" fill="black"/>

  <!-- Components on board -->
  <!-- Resistor 1 -->
  <rect x="155" y="210" width="35" height="12" rx="2" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="167" y="219" font-size="8">100Ω</text>
  <circle cx="160" cy="216" r="1.5" fill="black"/>
  <circle cx="185" cy="216" r="1.5" fill="black"/>

  <!-- Capacitor -->
  <rect x="210" y="240" width="30" height="18" fill="none" stroke="black" stroke-width="2"/>
  <line x1="215" y1="245" x2="235" y2="245" stroke="black" stroke-width="1"/>
  <line x1="215" y1="253" x2="235" y2="253" stroke="black" stroke-width="1"/>
  <text x="212" y="260" font-size="8">10µF</text>

  <!-- LED component -->
  <circle cx="120" cy="230" r="8" fill="none" stroke="black" stroke-width="1.5"/>
  <circle cx="120" cy="230" r="5" fill="none" stroke="black" stroke-width="1"/>
  <line x1="118" y1="237" x2="115" y2="243" stroke="black" stroke-width="1"/>
  <line x1="122" y1="237" x2="125" y2="243" stroke="black" stroke-width="1"/>

  <!-- Soldering iron -->
  <line x1="60" y1="80" x2="110" y2="150" stroke="black" stroke-width="3" stroke-linecap="round"/>
  <rect x="108" y="148" width="18" height="8" rx="2" fill="none" stroke="black" stroke-width="1.5"/>
  <polygon points="126,152 135,142 128,145" fill="black"/>

  <!-- Solder wire coil -->
  <circle cx="320" cy="100" r="18" fill="none" stroke="black" stroke-width="2"/>
  <circle cx="320" cy="100" r="14" fill="none" stroke="black" stroke-width="1"/>
  <circle cx="320" cy="100" r="8" fill="none" stroke="black" stroke-width="1"/>
  <line x1="332" y1="82" x2="340" y2="70" stroke="black" stroke-width="1.5"/>
  <text x="305" y="130" font-size="10">Solder</text>
  <text x="310" y="142" font-size="8">wire</text>

  <!-- Helper hands/clamps (shown as stands) -->
  <rect x="310" y="190" width="15" height="60" fill="none" stroke="black" stroke-width="2"/>
  <rect x="305" y="250" width="25" height="8" fill="none" stroke="black" stroke-width="1.5"/>
  <line x1="315" y1="195" x2="300" y2="210" stroke="black" stroke-width="1.5"/>
  <line x1="315" y1="195" x2="330" y2="210" stroke="black" stroke-width="1.5"/>

  <!-- Helping hands tool detail -->
  <circle cx="295" cy="215" r="6" fill="none" stroke="black" stroke-width="1.5"/>
  <circle cx="335" cy="215" r="6" fill="none" stroke="black" stroke-width="1.5"/>

  <!-- Safety notes area -->
  <rect x="85" y="310" width="230" height="50" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="95" y="330" font-size="10" font-weight="bold">⚠ Work area essentials:</text>
  <circle cx="100" cy="345" r="2" fill="black"/>
  <text x="107" y="348" font-size="9">Ventilation</text>
  <circle cx="210" cy="345" r="2" fill="black"/>
  <text x="217" y="348" font-size="9">Safety goggles</text>
  <circle cx="100" cy="360" r="2" fill="black"/>
  <text x="107" y="363" font-size="9">Heat-resistant mat</text>
  <circle cx="230" cy="360" r="2" fill="black"/>
  <text x="237" y="363" font-size="9">Fume extractor</text>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid5" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f0f0" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="400" height="500" fill="url(#grid5)" opacity="0.3"/>
</svg>