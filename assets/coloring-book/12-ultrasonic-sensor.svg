<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <text x="200" y="30" font-size="20" font-weight="bold" text-anchor="middle" font-family="sans-serif">Ultrasonic Sensor</text>
  <!-- sensor module -->
  <rect x="120" y="300" width="160" height="90" rx="8" stroke="black" fill="none" stroke-width="2"/>
  <circle cx="165" cy="345" r="34" stroke="black" fill="none" stroke-width="2"/>
  <circle cx="165" cy="345" r="24" stroke="black" fill="none" stroke-width="1.2"/>
  <circle cx="165" cy="345" r="10" stroke="black" fill="none" stroke-width="1"/>
  <circle cx="235" cy="345" r="34" stroke="black" fill="none" stroke-width="2"/>
  <circle cx="235" cy="345" r="24" stroke="black" fill="none" stroke-width="1.2"/>
  <circle cx="235" cy="345" r="10" stroke="black" fill="none" stroke-width="1"/>
  <!-- pins -->
  <line x1="170" y1="390" x2="170" y2="412" stroke="black" fill="none" stroke-width="1.5"/>
  <line x1="190" y1="390" x2="190" y2="412" stroke="black" fill="none" stroke-width="1.5"/>
  <line x1="210" y1="390" x2="210" y2="412" stroke="black" fill="none" stroke-width="1.5"/>
  <line x1="230" y1="390" x2="230" y2="412" stroke="black" fill="none" stroke-width="1.5"/>
  <!-- radar waves -->
  <path d="M 200 290 A 90 90 0 0 1 290 200" stroke="black" fill="none" stroke-width="1.5" stroke-dasharray="4,4"/>
  <path d="M 200 260 A 130 130 0 0 1 330 170" stroke="black" fill="none" stroke-width="1.5" stroke-dasharray="4,4"/>
  <path d="M 200 230 A 170 170 0 0 1 370 140" stroke="black" fill="none" stroke-width="1.5" stroke-dasharray="4,4"/>
  <path d="M 200 290 A 90 90 0 0 0 110 200" stroke="black" fill="none" stroke-width="1.5" stroke-dasharray="4,4"/>
  <path d="M 200 260 A 130 130 0 0 0 70 170" stroke="black" fill="none" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- target object -->
  <rect x="250" y="80" width="60" height="60" rx="6" stroke="black" fill="none" stroke-width="2"/>
  <line x1="250" y1="80" x2="310" y2="140" stroke="black" fill="none" stroke-width="1"/>
  <line x1="310" y1="80" x2="250" y2="140" stroke="black" fill="none" stroke-width="1"/>
  <defs>
    <pattern id="g12" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f0f0" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="400" height="500" fill="url(#g12)" opacity="0.3"/>
</svg>
